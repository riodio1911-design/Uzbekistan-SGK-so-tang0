*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--color-desk);color:var(--color-ink);font-family:var(--font-body);font-size:var(--text-body);line-height:var(--lh-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
.t0-top{position:sticky;top:0;z-index:var(--z-bar);background:var(--color-surface);border-bottom:1px solid var(--color-line);padding:var(--space-2) max(var(--space-4),env(safe-area-inset-left)) var(--space-2);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2)}
.t0-top h1{margin:0;font-family:var(--font-display);font-size:var(--text-h3);line-height:1.2;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t0-top h1 small{display:block;font-family:var(--font-body);font-weight:400;font-size:var(--text-xs);color:var(--color-ink-2)}
.t0-sel{min-height:var(--touch-min);border:1px solid var(--color-line);border-radius:var(--radius-pill);background:var(--color-surface);color:var(--color-ink);font:inherit;font-size:var(--text-ui);padding:0 var(--space-3)}
.t0-modes{display:flex;gap:4px;background:var(--color-surface-2);border-radius:var(--radius-pill);padding:3px;order:5;flex:1 1 100%}
.t0-modes[hidden]{display:none}
.t0-modes button{flex:1;min-height:var(--touch-min);border:0;border-radius:var(--radius-pill);background:transparent;color:var(--color-ink-2);font:inherit;font-size:var(--text-ui);cursor:pointer;padding:0 var(--space-3)}
.t0-modes button[aria-pressed="true"]{background:var(--color-surface);color:var(--color-ink);font-weight:600;box-shadow:var(--shadow-1)}
@media (min-width:820px){.t0-modes{order:0;flex:0 0 auto}}
.t0-ctrl{display:flex;gap:var(--space-2);align-items:center;min-width:0}
.t0-sel{max-width:100%;min-width:0}
.t0-tools{display:flex;gap:var(--space-2);align-items:center;flex:none}
.t0-tools:empty{display:none}
.t0-dual{min-width:0;padding:0 10px;font-weight:700;font-size:var(--text-sm);letter-spacing:.03em;color:var(--color-ink-2);text-decoration:line-through}
.t0-dual[aria-pressed="true"]{color:var(--color-accent-ink,var(--color-accent));text-decoration:none;background:var(--color-accent-soft)}
#t0-main{min-height:calc(100vh - 120px)}
@media (max-width:599px){.t0-top h1{flex:1 1 100%}.t0-ctrl{flex:1 1 100%}.t0-ctrl #t0-book{flex:1;min-width:0}}
</style>

<script data-inline="boot">
(function () {
  const T0 = window.T0;
  const S = window.T0_SAMPLES || {};
  const $ = (id) => document.getElementById(id);
  const VIEW2MODE = { trang_goc_ghim: 'pin', bai_hoc: 'lesson', doc_van: 'reading' };
  const q = new URLSearchParams(location.search);
  const theme = (() => { try { return localStorage.getItem('t0:_:theme'); } catch (e) { return null; } })() || q.get('theme');
  if (theme) document.documentElement.dataset.theme = theme;
  T0.boot({ root: $('t0-main') });

  const bookSel = $('t0-book');
  Object.keys(S).forEach((id) => {
    const p = S[id].book.profile || {};
    bookSel.append(new Option(T0.t(p.title) + ' ' + (p.grade != null ? p.grade : ''), id));
  });
  // L01/L03: ô ngôn ngữ dựng theo cuốn – các tiếng của sách + chế độ song ngữ (ghép reader_langs, vd. "Việt+Рус")
  const LN = { uz: 'O‘zb', ru: 'Рус', vi: 'Việt' };
  const DUAL_T = { uz: 'Asl matn ({b}) bilan birga', ru: 'Показывать оригинал ({b})', vi: 'Hiện kèm bản gốc ({b})' };
  function renderLang() {
    const sel = $('t0-lang');
    const ls = T0.bookLangs(); const rl = T0.readerLangs();
    const vals = ls.slice();
    if (rl.length >= 2) vals.push(rl[0] + '+' + rl[1], rl[1] + '+' + rl[0]);
    const cur = T0.lang + (T0.lang2 ? '+' + T0.lang2 : '');
    if (!vals.includes(cur)) vals.push(cur);
    sel.innerHTML = '';
    vals.forEach((v) => sel.append(new Option(v.split('+').map((x) => LN[x] || x).join('+'), v)));
    sel.value = cur;
    const base = T0.baseLang(), d = $('t0-dual');
    d.hidden = T0.lang === base && !T0.lang2;
    d.textContent = base.toUpperCase();
    d.setAttribute('aria-pressed', String(!!T0.dual));
    const tt = T0.t(DUAL_T).replace('{b}', base.toUpperCase());
    d.title = tt; d.setAttribute('aria-label', tt);
  }

  function renderTop() {
    const p = T0.book.profile || {};
    $('t0-title-t').textContent = T0.tUI(p.title) + (p.grade != null ? ' · ' + p.grade : '');
    renderLang();
    const lt = { uz: 'sinf', ru: 'класс', vi: 'lớp' };
    $('t0-title-s').textContent = (T0.book.book_id) + ' · ' + (p.grade != null ? p.grade + ' ' + lt[T0.lang] : '');
    const nav = $('t0-modes'); nav.innerHTML = '';
    const av = T0.availableModes();
    nav.hidden = av.length < 2;
    av.forEach((m) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = T0.modeLabel(m); b.dataset.mode = m;
      b.setAttribute('aria-pressed', String(T0.currentMode() === m));
      b.onclick = () => { T0.setMode(m); };
      nav.append(b);
    });
  }
  let firstOpen = true;
  function openBook(id, mode) {
    const s = S[id]; if (!s) return;
    T0.load(s.book, s.features);
    try { localStorage.setItem('t0:_:book', id); } catch (e) {}
    bookSel.value = id;
    const av = T0.availableModes();
    // G08 (N → L): link sâu #pN / #<tập>-pN -> chọn thẳng chế độ trang (không nháy chế độ nhớ / ?mode=)
    const deep = firstOpen && /^#(?:[A-Za-z0-9_]+-)?p\d+$/.test(location.hash || '') && av.includes('pin') && ((s.features.features || {}).deep_link !== false);
    const want = deep ? 'pin' : mode || T0.store.get('mode') || VIEW2MODE[(s.features.layers || {}).default_view] || 'pin';
    const m = av.includes(want) ? want : av[0];
    renderTop();
    // ?page= chỉ là điểm vào của lần mở đầu
    const target = firstOpen && q.get('page') ? { page: +q.get('page') } : null;
    firstOpen = false;
    if (m) T0.setMode(m, { target });
  }
  T0.on('t0:mode', () => document.querySelectorAll('#t0-modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === T0.currentMode()))));
  T0.on('t0:lang', () => { renderTop(); });
  $('t0-dual').onclick = () => T0.setDual(!T0.dual);
  bookSel.onchange = () => openBook(bookSel.value);
  $('t0-lang').onchange = (e) => T0.setLang(e.target.value);
  $('t0-theme').onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('t0:_:theme', r.dataset.theme); } catch (e) {}
  };
  const first = q.get('book') || (() => { try { return localStorage.getItem('t0:_:book'); } catch (e) { return null; } })();
  openBook(S[first] ? first : Object.keys(S)[0], q.get('mode'));
})();
</script>
