<script>/* components/sim/scene_player.js */
/* sim.scene_player – trình phát "video" hoạt hình dựng bằng mã (R1, tối thiểu để ghim video mở được).
 * params: {video: <id trong book.videos> | <đối tượng video>}. Mỗi cảnh: tiêu đề, hình (T0.renderSim(scene.visual)),
 * lời thuyết minh (T0.media.play(audio_ref) – không có file thì giọng trình duyệt). Tự sang cảnh khi đọc xong.
 * Kèm sim.scene_page_image (cắt ảnh trang) vì cảnh của kimyo8 dùng. */
(function () {
  const T0 = window.T0;
  const CSS = `
.sp{display:flex;flex-direction:column;gap:var(--space-3,12px)}
.sp-stage{background:var(--color-video-bg,#0b1a26);border-radius:var(--radius-md,10px);padding:var(--space-3,12px);min-height:180px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.sp-stage .t0-unsupported{color:#cfd8e0;border-color:#4a6378}
.sp-title{margin:0;font-size:var(--text-h3,18px);font-family:var(--font-display)}
.sp-nar{margin:0;line-height:var(--lh-body,1.5);font-size:var(--text-body,16px)}
.sp-ctl{display:flex;gap:var(--space-2,8px);align-items:center;flex-wrap:wrap}
.sp-dots{display:flex;gap:6px;flex:1;justify-content:center}
.sp-dots button{width:var(--touch-min,44px);height:var(--touch-min,44px);border:0;background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.sp-dots button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--color-line)}
.sp-dots button[aria-current="true"]::before{background:var(--color-accent);width:22px;border-radius:5px}`;
  function css() { if (!document.getElementById('sp-css')) document.head.append(Object.assign(document.createElement('style'), { id: 'sp-css', textContent: CSS })); }
  const L = { play: { uz: 'Ijro', ru: 'Пуск', vi: 'Phát' }, pause: { uz: 'To‘xtatish', ru: 'Пауза', vi: 'Dừng' }, prev: { uz: 'Oldingi', ru: 'Назад', vi: 'Trước' }, next: { uz: 'Keyingi', ru: 'Далее', vi: 'Tiếp' } };

  T0.registerSim('sim.scene_player', {
    mount(el, params, ctx) {
      css();
      const E = T0.ui.el;
      const v = typeof params.video === 'string' ? T0.find('video', params.video) : params.video;
      const root = E('div', { class: 'sp' });
      el.append(root);
      if (!v) { root.append(E('div', { class: 't0-unsupported', text: T0.s('not_found') + ': ' + params.video })); return { unmount() { root.remove(); } }; }
      let i = 0, playing = false, visual = null, token = 0;
      const stage = E('div', { class: 'sp-stage' });
      const title = E('h3', { class: 'sp-title' });
      const nar = E('p', { class: 'sp-nar', 'aria-live': 'polite' });
      const prev = E('button', { class: 't0-btn', type: 'button', 'aria-label': T0.t(L.prev) }, '◀');
      const play = E('button', { class: 't0-btn primary', type: 'button' });
      const next = E('button', { class: 't0-btn', type: 'button', 'aria-label': T0.t(L.next) }, '▶');
      const dots = E('div', { class: 'sp-dots' });
      root.append(title, stage, nar, E('div', { class: 'sp-ctl' }, prev, dots, next, play));
      function show(n) {
        i = Math.max(0, Math.min(v.scenes.length - 1, n));
        const sc = v.scenes[i];
        if (visual && visual.unmount) visual.unmount();
        stage.innerHTML = '';
        title.textContent = T0.t(sc.title) || T0.t(v.title);
        nar.textContent = T0.t(sc.narration);
        visual = sc.visual.type === 'image' ? (stage.append(E('img', { src: T0.asset(sc.visual.src), alt: '', style: { width: '100%' } })), null) : T0.renderSim(stage, { kind: sc.visual.kind, params: sc.visual.params || {} });
        dots.innerHTML = '';
        v.scenes.forEach((_, j) => { const d = E('button', { type: 'button', 'aria-label': String(j + 1), 'aria-current': String(j === i) }); d.onclick = () => go(j); dots.append(d); });
        prev.disabled = i === 0; next.disabled = i === v.scenes.length - 1;
      }
      async function speakScene() {
        const my = ++token;
        const sc = v.scenes[i];
        const t0 = Date.now();
        if (sc.narration && sc.narration.audio_ref) await T0.media.play(sc.narration.audio_ref, { text: sc.narration });
        else await T0.media.speak(T0.t(sc.narration));
        const wait = (sc.min_seconds || 0) * 1000 - (Date.now() - t0);
        if (wait > 0) await new Promise((r) => setTimeout(r, wait));
        if (my !== token || !playing) return;
        if (i < v.scenes.length - 1) { show(i + 1); speakScene(); } else setPlaying(false);
      }
      function setPlaying(p) { playing = p; play.textContent = p ? '❚❚ ' + T0.t(L.pause) : '▶ ' + T0.t(L.play); if (!p) { token++; T0.media.stop(); } }
      function go(n) { const was = playing; setPlaying(false); show(n); if (was) { setPlaying(true); speakScene(); } }
      play.onclick = () => { if (playing) setPlaying(false); else { setPlaying(true); speakScene(); } };
      prev.onclick = () => go(i - 1); next.onclick = () => go(i + 1);
      const off = T0.on('t0:lang', () => { const was = playing; setPlaying(false); show(i); prev.setAttribute('aria-label', T0.t(L.prev)); next.setAttribute('aria-label', T0.t(L.next)); if (was) { setPlaying(true); speakScene(); } });
      setPlaying(false); show(0);
      if (params.autoplay) { setPlaying(true); speakScene(); }
      return { unmount() { setPlaying(false); off(); visual && visual.unmount && visual.unmount(); root.remove(); }, show };
    },
  });

  T0.registerSim('sim.scene_page_image', {
    mount(el, params) {
      const c = params.crop || {};
      const box = T0.ui.el('div', { style: { background: 'var(--color-page-paper)', borderRadius: '8px', overflow: 'hidden' } }, T0.ui.pageCrop(c.page, c.box));
      el.append(box);
      return { unmount() { box.remove(); } };
    },
  });
})();

</script>
<script>/* modes/lesson.js */
/* modes/lesson.js — R2. Lớp bật thêm "bài học" (D1): dựng lại bài theo khối từ book.lessons[].blocks,
   kèm giới thiệu chương (units[].intro), vở bài tập (workbook_sets) và bài tập (T0.renderEx).
   available: features.layers.bai_hoc !== false VÀ có ít nhất một bài có blocks.
   Ghi nhớ vị trí: T0.store 'lesson:view'. ctx.target của setMode: {lesson}|{workbook}|{page} (mở đúng bài). Không viết cứng môn/lớp: mọi chữ nội dung lấy từ book.json. */
(function () {
  const T0 = window.T0 = window.T0 || {};
  const UI = {
    label: { uz: 'Dars', ru: 'Урок', vi: 'Bài học' },
    lessons: { uz: 'Mavzular', ru: 'Темы', vi: 'Các bài' },
    workbook: { uz: 'Mashq daftari', ru: 'Рабочая тетрадь', vi: 'Vở bài tập' },
    intro: { uz: 'Bob bilan tanishuv', ru: 'Знакомство с главой', vi: 'Giới thiệu chương' },
    listenAll: { uz: 'Butun darsni tinglash', ru: 'Слушать весь урок', vi: 'Nghe cả bài' },
    stop: { uz: 'To‘xtatish', ru: 'Стоп', vi: 'Dừng' },
    prev: { uz: 'Oldingi', ru: 'Назад', vi: 'Bài trước' }, next: { uz: 'Keyingi', ru: 'Далее', vi: 'Bài tiếp' },
    page: { uz: 'bet', ru: 'стр.', vi: 'trang' },
    ask: { uz: 'Yordamchidan so‘rash', ru: 'Спросить помощника', vi: 'Hỏi gia sư' },
    orig: { uz: 'Asl matn', ru: 'Оригинал', vi: 'Kèm bản gốc' },
    skills: { uz: 'Ko‘nikmalar', ru: 'Навыки', vi: 'Kỹ năng' },
    need: { uz: 'Sizga kerak bo‘ladi:', ru: 'Вам понадобится:', vi: 'Em cần chuẩn bị:' },
    steps: { uz: 'Ishni bajarish tartibi:', ru: 'Порядок выполнения:', vi: 'Các bước thực hiện:' },
    pageImg: { uz: 'Daftar sahifasi', ru: 'Страница тетради', vi: 'Trang vở in' },
    none: { uz: 'Bu kitobda dars bloklari yo‘q.', ru: 'В этой книге нет блоков урока.', vi: 'Cuốn này chưa có dữ liệu bài học.' }
  };
  const B = () => T0.blocks.u;
  const t = o => (T0.t ? T0.t(o) : (o && (o[T0.lang] || o.uz))) || '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function available(book, features) {
    if (features && features.layers && features.layers.bai_hoc === false) return false;
    return !!(book && (book.lessons || []).some(l => l.blocks && l.blocks.length));
  }

  /* danh mục điều hướng: theo chương; mỗi bài có blocks; sau đó bộ vở bài tập gắn với bài */
  function toc(book) {
    const out = []; const seen = new Set();
    const lessons = (book.lessons || []).filter(l => l.blocks && l.blocks.length);
    const wbs = book.workbook_sets || [];
    (book.units || []).forEach(u => {
      const ls = lessons.filter(l => l.unit === u.id);
      ls.forEach(l => {
        seen.add(l.id); out.push({ type: 'lesson', id: l.id, unit: u, item: l });
        wbs.filter(w => w.lesson === l.id).forEach(w => { seen.add(w.id); out.push({ type: 'wb', id: w.id, unit: u, item: w }); });
      });
    });
    lessons.filter(l => !seen.has(l.id)).forEach(l => out.push({ type: 'lesson', id: l.id, unit: null, item: l }));
    wbs.filter(w => !seen.has(w.id)).forEach(w => out.push({ type: 'wb', id: w.id, unit: null, item: w }));
    return out;
  }

  function mount(root, ctx0) {
    const book = T0.book; const list = toc(book);
    let cur = (T0.store && T0.store.get('lesson:view', null)) || null;
    if (!cur || !list.some(x => x.type === cur.type && x.id === cur.id)) cur = list[0] ? { type: list[0].type, id: list[0].id } : null;
    let dual = !!(T0.store && T0.store.get('lesson:dual', false));
    let mounted = [];   // các khối/bài tập đã gắn (để unmount)
    let queue = null;   // nghe cả bài

    root.innerHTML = '';
    const wrap = B().h('div', 't0l');
    root.append(wrap);

    /* ctx riêng của lớp bài học (không chép book/lang để core giữ getter theo trạng thái hiện tại) */
    const ctx = {
      mode: 'lesson',
      get dual() { return dual; },
      renderExercise: (el, id) => renderExercise(el, id),
      openWorkbook: id => go({ type: 'wb', id })
    };
    const goMode = (ctx0 && ctx0.go) || ((m, o) => T0.setMode(m, o));
    const target = ctx0 && ctx0.target;
    if (target && (target.lesson || target.workbook)) {
      const want = target.lesson ? { type: 'lesson', id: target.lesson } : { type: 'wb', id: target.workbook };
      if (list.some(x => x.type === want.type && x.id === want.id)) cur = want;
    } else if (target && target.page != null) {
      const hit = list.find(x => x.type === 'lesson' && (x.item.page === target.page || (x.item.page_range && target.page >= x.item.page_range[0] && target.page <= x.item.page_range[1])));
      if (hit) cur = { type: 'lesson', id: hit.id };
    }

    function go(v) { stopQueue(); cur = v; T0.store && T0.store.set('lesson:view', v); draw(); root.scrollIntoView && wrap.scrollIntoView({ block: 'start' }); window.scrollTo && window.scrollTo(0, 0); }

    /* bài tập: T0.renderEx của core vẽ phần đầu (prompt), nút Kiểm tra/Làm lại, phản hồi, lưu 'res:<id>' */
    function renderExercise(el, id) {
      const ex = B().byId(book.exercises, id);
      const host = B().h('div', 't0l-ex'); host.dataset.exRef = id; el.append(host);
      if (!ex) { host.innerHTML = `<div class="t0b-missing">${esc(id)}</div>`; return; }
      try { mounted.push(T0.renderEx(host, ex, ctx)); } catch (e) { console.error('[lesson] renderEx', id, e); host.innerHTML = `<div class="t0b-missing">${esc(ex.kind)}</div>`; }
    }

    function clearMounted() { mounted.forEach(m => { try { m && m.unmount && m.unmount(); } catch (e) {} }); mounted = []; }

    /* nghe cả bài: phát lần lượt audio_ref của các khối, tô khối đang đọc */
    function stopQueue() {
      if (!queue) return; const q = queue; queue = null; clearTimeout(q.tm); q.cur && q.cur.classList.remove('t0b-speaking');
      try { T0.media && T0.media.stop(); } catch (e) {}
      const b = wrap.querySelector('[data-a=all]'); if (b) { b.setAttribute('aria-pressed', 'false'); b.lastChild.textContent = t(UI.listenAll); }
    }
    function playAll(btn) {
      if (queue) { stopQueue(); return; }
      const secs = [...wrap.querySelectorAll('.t0l-main [data-block]')].map(s => ({ s, b: findBlock(s.dataset.block) })).filter(x => x.b && x.b.audio_ref);
      if (!secs.length) return;
      queue = { k: 0, tm: null, cur: null };
      btn.setAttribute('aria-pressed', 'true'); btn.lastChild.textContent = t(UI.stop);
      const step = () => {
        if (!queue) return;
        if (queue.cur) queue.cur.classList.remove('t0b-speaking');
        if (queue.k >= secs.length) { stopQueue(); return; }
        const { s, b } = secs[queue.k++]; queue.cur = s; s.classList.add('t0b-speaking'); s.scrollIntoView({ block: 'center', behavior: 'smooth' });
        const me = queue; let pr = null;
        try { pr = T0.media.play(b.audio_ref, {}); } catch (e) {}
        const nxt = () => { if (queue === me) queue.tm = setTimeout(step, 400); };
        if (pr && pr.then) pr.then(ok => { if (ok === false) stopQueue(); else nxt(); }, nxt); else nxt();
      };
      step();
    }
    function findBlock(id) { for (const l of book.lessons || []) for (const b of l.blocks || []) if (b.id === id) return b; return null; }

    function draw() {
      clearMounted(); stopQueue();
      if (!cur) { wrap.innerHTML = `<p class="t0b-missing">${esc(t(UI.none))}</p>`; return; }
      const idx = list.findIndex(x => x.type === cur.type && x.id === cur.id); const entry = list[idx];
      const groups = []; list.forEach((x, k) => { const g = x.unit ? x.unit.id : '_'; let gg = groups.find(y => y.id === g); if (!gg) groups.push(gg = { id: g, unit: x.unit, items: [] }); gg.items.push([x, k]); });
      const optLabel = x => x.type === 'lesson' ? `${x.item.no ? x.item.no + ' · ' : ''}${B().plain(x.item.title)}` : `${t(UI.workbook)} · ${x.item.no ? x.item.no + ' ' : ''}${B().plain(x.item.title)}`;
      const hasAudio = entry.type === 'lesson' && (entry.item.blocks || []).some(b => b.audio_ref);
      const base = (book.profile && book.profile.lang_base) || 'uz';
      wrap.innerHTML = `<div class="t0l-bar"><label class="t0l-sel"><span class="t0l-vh">${esc(t(UI.lessons))}</span><select class="k-hit" data-a="sel">${groups.map(g => `<optgroup label="${esc(g.unit ? (g.unit.no != null ? g.unit.no + '. ' : '') + B().plain(g.unit.title) : '—')}">${g.items.map(([x, k]) => `<option value="${k}"${k === idx ? ' selected' : ''}>${esc(optLabel(x))}</option>`).join('')}</optgroup>`).join('')}</select></label>
        <div class="t0l-tools">${hasAudio ? `<button type="button" class="t0l-btn k-hit" data-a="all" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" fill="currentColor"/></svg><span>${esc(t(UI.listenAll))}</span></button>` : ''}
        ${T0.lang !== base ? `<button type="button" class="t0l-btn k-hit" data-a="dual" aria-pressed="${dual}">${esc(t(UI.orig))}</button>` : ''}
        ${T0.tutor ? `<button type="button" class="t0l-btn k-hit" data-a="ask">${esc(t(UI.ask))}</button>` : ''}</div></div>
        <article class="t0l-main"></article>
        <nav class="t0l-nav">${idx > 0 ? `<button type="button" class="t0l-btn k-hit" data-a="prev">← ${esc(t(UI.prev))}</button>` : '<span></span>'}${idx < list.length - 1 ? `<button type="button" class="t0l-btn t0l-primary k-hit" data-a="next">${esc(t(UI.next))} →</button>` : '<span></span>'}</nav>`;
      const main = wrap.querySelector('.t0l-main');
      if (entry.type === 'lesson') drawLesson(main, entry); else drawWorkbook(main, entry);
      wrap.querySelector('[data-a=sel]').onchange = e => { const x = list[+e.target.value]; go({ type: x.type, id: x.id }); };
      wrap.querySelectorAll('.t0l-bar [data-a], .t0l-nav [data-a]').forEach(b => {
        const a = b.dataset.a; if (a === 'sel') return;
        b.onclick = () => {
          if (a === 'prev') { const x = list[idx - 1]; go({ type: x.type, id: x.id }); }
          if (a === 'next') { const x = list[idx + 1]; go({ type: x.type, id: x.id }); }
          if (a === 'all') playAll(b);
          if (a === 'dual') { dual = !dual; T0.store && T0.store.set('lesson:dual', dual); draw(); }
          if (a === 'ask') T0.tutor.open({ role: 'chat', context: contextText(entry) });
        };
      });
    }

    /* ngữ cảnh gửi gia sư: chữ của bài hiện tại (giới hạn 9000 ký tự như gia-su/prompts.json role chat) */
    function contextText(entry) {
      const parts = []; const it = entry.item; const P = o => o ? (o.uz || '') + (T0.lang !== 'uz' && o[T0.lang] ? ' / ' + o[T0.lang] : '') : '';
      parts.push((it.no || '') + ' ' + P(it.title));
      if (entry.type === 'lesson') (it.blocks || []).forEach(b => { if (b.title) parts.push(P(b.title)); (b.paras || []).concat(b.items || []).forEach(p => parts.push(P(p))); });
      else { parts.push(P(it.skills)); parts.push(P(it.need)); (it.steps || []).forEach(s => parts.push(P(s))); }
      return { kind: entry.type, id: entry.id, text: parts.join('\n').replace(/\*\*/g, '').slice(0, 9000) };
    }

    function drawLesson(main, entry) {
      const l = entry.item; const u = entry.unit;
      if (u && u.intro && u.intro.length && (u.lesson_refs || [])[0] === l.id) {
        const sec = B().h('section', 't0l-unit');
        sec.innerHTML = `<div class="t0l-unit-h">${u.no != null ? `<span class="t0l-unit-no">${esc(u.no)}</span>` : ''}<div><small>${esc(t(UI.intro))}</small><h2>${B().tx(u.title, ctx)}</h2></div></div>
          ${u.image ? `<img class="t0l-unit-img" src="${esc(B().asset(u.image))}" alt="" loading="lazy">` : ''}
          <ul>${u.intro.map(p => `<li>${B().tx(p, ctx)}</li>`).join('')}</ul>`;
        main.append(sec);
      }
      const hd = B().h('header', 't0l-head');
      const pageLab = l.page != null ? `${esc(t(UI.page))} ${esc(l.page)}` : '';
      const canPin = T0.availableModes && T0.availableModes().includes('pin');
      hd.innerHTML = `${l.no != null ? `<span class="t0l-no">${esc(l.no)}</span>` : ''}<h1>${B().tx(l.title, ctx)}</h1>${pageLab ? (canPin ? `<button type="button" class="t0l-btn t0l-pg k-hit"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2"/></svg>${pageLab}</button>` : `<span class="t0l-pgl">${pageLab}</span>`) : ''}`;
      const pg = hd.querySelector('.t0l-pg'); if (pg) pg.onclick = () => goMode('pin', { target: { page: l.page } });
      main.append(hd);
      (l.blocks || []).forEach(b => mounted.push(T0.blocks.render(main, b, ctx)));
    }

    function drawWorkbook(main, entry) {
      const w = entry.item;
      const hd = B().h('header', 't0l-head t0l-wbhead');
      hd.innerHTML = `${w.no ? `<span class="t0l-no">${esc(w.no)}</span>` : ''}<div><small>${esc(t(UI.workbook))}${w.kind ? ' · ' + B().tx(w.kind, ctx) : ''}</small><h1>${B().tx(w.title, ctx)}</h1></div>`;
      main.append(hd);
      if (w.skills) main.append(B().h('section', 't0b t0l-wbskills', `<div class="t0b-rub">${esc(t(UI.skills))}</div><p>${B().tx(w.skills, ctx)}</p>`));
      if (w.need || w.steps) {
        const s = B().h('section', 't0b');
        if (w.need) s.append(B().h('div', 't0b-need', `<b>${esc(t(UI.need))}</b><p>${B().tx(w.need, ctx)}</p>`));
        if (w.steps) s.append(B().h('div', 't0b-steps', `<b>${esc(t(UI.steps))}</b><ol>${w.steps.map(x => `<li>${B().tx(x, ctx)}</li>`).join('')}</ol>`));
        main.append(s);
      }
      /* trang vở in (ảnh gốc) để đối chiếu — chạm để phóng to */
      const vol = w.volume; const [p0, p1] = w.page_range || [];
      const pages = (book.pages || []).filter(p => (!vol || p.volume === vol) && p0 != null && p.n >= p0 && p.n <= (p1 || p0));
      if (pages.length) {
        const s = B().h('section', 't0b t0l-wbpages', `<div class="t0b-rub">${esc(t(UI.pageImg))}</div>`);
        const row = B().h('div', 't0l-thumbs');
        pages.forEach(p => {
          const src = B().pageImg(p.n, p.volume); if (!src) return;
          const btn = B().h('button', 't0l-thumb k-hit', `<img src="${esc(B().asset(src))}" alt="${esc(t(UI.pageImg))} ${p.n}" loading="lazy"><span>${esc(p.label || p.n)}</span>`);
          btn.type = 'button';
          btn.onclick = () => { const im = B().h('img', 't0l-bigpage'); im.src = B().asset(src); im.alt = ''; T0.ui.modal(im, { title: `${t(UI.workbook)} · ${p.label || p.n}` }); };
          row.append(btn);
        });
        s.append(row); main.append(s);
      }
      const refs = (w.exercise_refs || []).slice();
      (book.exercises || []).forEach(e => { if (e.volume === vol && w.lesson && e.lesson === w.lesson && e.page != null && e.page >= p0 && e.page <= (p1 || p0) && !refs.includes(e.id)) refs.push(e.id); });
      refs.forEach(id => { const s = B().h('section', 't0b t0l-wbex'); main.append(s); renderExercise(s, id); });
    }

    const onLang = () => draw();
    document.addEventListener('t0:lang', onLang);
    draw();
    return { unmount() { stopQueue(); clearMounted(); document.removeEventListener('t0:lang', onLang); root.innerHTML = ''; } };
  }

  const css = `
.t0l{max-width:780px;margin:0 auto;padding:0 var(--space-4) var(--space-8);box-sizing:border-box;color:var(--color-ink);font-family:var(--font-body)}
.t0l *{box-sizing:border-box}
.t0l-bar{position:sticky;top:0;z-index:var(--z-bar);display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:var(--space-2) 0;background:var(--color-bg);border-bottom:1px solid var(--color-line);margin-bottom:var(--space-4)}
.t0l-sel{flex:1 1 220px;min-width:0}
@media (max-width:599px){.t0l-bar{position:static}.t0l-tools{flex-wrap:nowrap;overflow-x:auto;width:100%}.t0l-tools .t0l-btn{flex:none}.t0l-unit-img{max-height:170px}}
.t0l-sel select{width:100%;min-height:var(--touch-min);font:inherit;font-weight:700;color:var(--color-ink);background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-sm);padding:0 10px}
.t0l-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.t0l-tools{display:flex;gap:var(--space-2);flex-wrap:wrap}
.t0l-btn{display:inline-flex;align-items:center;gap:6px;min-height:var(--touch-min);padding:0 var(--space-3);border-radius:var(--radius-pill);border:1px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);font:inherit;font-size:var(--text-sm);font-weight:700;cursor:pointer}
.t0l-btn[aria-pressed=true]{background:var(--color-accent-soft);border-color:var(--color-accent);color:var(--color-accent-ink)}
.t0l-primary{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.t0l-unit{background:var(--color-accent-soft);border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-5)}
.t0l-unit-h{display:flex;gap:var(--space-3);align-items:center}
.t0l-unit-no{width:56px;height:56px;border-radius:50%;background:var(--color-accent);color:var(--color-on-accent);display:grid;place-items:center;font:800 28px var(--font-display);flex:none}
.t0l-unit-h small{color:var(--color-accent-ink);font-weight:700}.t0l-unit-h h2{margin:0;font-family:var(--font-display);font-size:var(--text-h2);line-height:1.15}
.t0l-unit-img{width:100%;max-height:260px;object-fit:contain;margin:var(--space-3) 0;border-radius:var(--radius-md);background:var(--color-surface)}
.t0l-unit ul{margin:var(--space-3) 0 0;padding-left:1.2em}.t0l-unit li{margin-bottom:6px;line-height:var(--lh-body)}
.t0l-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);margin:0 0 var(--space-4)}
.t0l-head h1{margin:0;font-family:var(--font-display);font-size:var(--text-h1);line-height:1.1;flex:1 1 auto}
.t0l-head small{color:var(--color-ink-2);font-weight:700}
.t0l-wbhead>div{flex:1}
.t0l-no{background:var(--color-accent);color:var(--color-on-accent);font:800 var(--text-lg) var(--font-display);padding:2px 12px;border-radius:var(--radius-pill)}
.t0l-pgl{color:var(--color-ink-2);font-size:var(--text-sm)}
.t0l-wbex .t0-ex{border:0}
.t0l-wbskills p{margin:4px 0 0;line-height:var(--lh-body)}
.t0l-thumbs{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-2)}
.t0l-thumb{border:1px solid var(--color-line);border-radius:var(--radius-sm);background:var(--color-page-paper);padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:var(--text-xs);color:var(--color-ink-2)}
.t0l-thumb img{width:120px;height:auto;display:block}
.t0l-bigpage{max-width:100%;height:auto;display:block}
.t0l-nav{display:flex;justify-content:space-between;gap:var(--space-3);margin-top:var(--space-5)}
`;
  if (!document.getElementById('t0l-css')) { const s = document.createElement('style'); s.id = 't0l-css'; s.textContent = css; document.head.append(s); }

  if (T0.registerMode) T0.registerMode('lesson', { label: UI.label, available, mount });
})();

</script>
<script>/* modes/pin.js */
/* Chế độ nền "trang gốc + ghim" (R1).
 * Ảnh trang theo bản in (images[uz|ru]); vùng chạm dịch `tr` (bong bóng theo T0.lang); ghim `pins` (tọa độ %)
 * mở bài tập / hình / video / mô phỏng trong modal, ghim audio phát clip. Lật trang (nút, ←/→, vuốt), phóng to.
 * Bản in khác bản gốc (vd. pages_ru): tọa độ `tr` thuộc bản gốc nên ẩn vùng dịch, ghim dồn thành cột lề phải
 * (như kimyo8 cũ); bản dịch xem ở ngăn "Tarjima". */
(function () {
  const T0 = window.T0;
  const L = {
    label: { uz: 'Sahifa', ru: 'Страницы', vi: 'Trang gốc' },
    prev: { uz: 'Oldingi sahifa', ru: 'Предыдущая страница', vi: 'Trang trước' },
    next: { uz: 'Keyingi sahifa', ru: 'Следующая страница', vi: 'Trang sau' },
    page: { uz: 'Sahifa', ru: 'Стр.', vi: 'Trang' },
    edition: { uz: 'Nashr', ru: 'Издание', vi: 'Bản in' },
    tr: { uz: 'Tarjima', ru: 'Перевод', vi: 'Bản dịch' },
    trShow: { uz: 'Tarjima joylarini ko‘rsatish', ru: 'Показать места перевода', vi: 'Hiện vùng có bản dịch' },
    pins: { uz: 'Belgilar', ru: 'Значки', vi: 'Ghim' },
    zoomIn: { uz: 'Kattalashtirish', ru: 'Увеличить', vi: 'Phóng to' },
    zoomOut: { uz: 'Kichiklashtirish', ru: 'Уменьшить', vi: 'Thu nhỏ' },
    listen: { uz: 'Tinglash', ru: 'Слушать', vi: 'Nghe' },
    onPage: { uz: 'Sahifadagi belgilar', ru: 'Значки на странице', vi: 'Ghim trên trang' },
    missing: { uz: 'Bu parchada ma’lumot yo‘q', ru: 'В этом фрагменте нет данных', vi: 'Bản trích chưa có dữ liệu này' },
    noTr: { uz: 'Bu sahifada tarjima yo‘q', ru: 'На этой странице нет перевода', vi: 'Trang này chưa có bản dịch' },
  };
  const KIND = {

  function css() { if (!document.getElementById('pm-css')) document.head.append(Object.assign(document.createElement('style'), { id: 'pm-css', textContent: CSS })); }

  function available(book, features) {

  function mount(host, ctx) {

    let zoom = 1, showTr = false, showPins = true, openBub = null, playingPin = null;
    const cleanup = [];

    const root = E('div', { class: 'pm' });
    host.append(root);
    const bar = E('div', { class: 'pm-bar' });
    const scroll = E('div', { class: 'pm-scroll' });
    const spread = E('div', { class: 'pm-spread' });
    scroll.append(spread);
    root.append(bar, scroll);

    const edition = () => {
      if (edChosen && editions.includes(edChosen)) return edChosen;
      return editions.includes(base) ? base : editions[0]; // mặc định bản gốc (vùng dịch khớp tọa độ); bản in khác chọn bằng nút
    };
    const volTitle = (vid) => { const v = (prof.volumes || []).find((x) => x.id === vid); return v && v.kind !== 'textbook' ? (T0.t(v.title) || v.id) + ' · ' : ''; };
    const pageName = (p) => volTitle(p.volume) + T0.t(L.page) + ' ' + (p.label || p.n);
    const twoUp = () => zoom === 1 && scroll.clientWidth >= 1100 && pages[idx + 1] && pages[idx + 1].volume === pages[idx].volume;

    /* ---------- thanh công cụ ---------- */
    function drawBar() {
      bar.innerHTML = '';
      const prev = E('button', { class: 't0-btn', type: 'button', 'aria-label': T0.t(L.prev), title: T0.t(L.prev), html: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' });
      const next = E('button', { class: 't0-btn', type: 'button', 'aria-label': T0.t(L.next), title: T0.t(L.next), html: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>' });

      if (editions.length > 1) {
        const seg = E('div', { class: 'pm-seg', role: 'group', 'aria-label': T0.t(L.edition) });
        editions.forEach((ed) => {
          const b = E('button', { type: 'button', 'aria-pressed': String(edition() === ed), text: ed.toUpperCase(), title: T0.t(L.edition) + ' ' + ed.toUpperCase() });
          b.onclick = () => { edChosen = ed; T0.store.set('pin:ed', ed); drawBar(); drawPages(); };
          seg.append(b);
        });
        bar.append(seg);
      }
      bar.append(E('span', { class: 'pm-sp' }));
      const trT = E('button', { class: 't0-btn pm-tog pm-hide-s', type: 'button', 'aria-pressed': String(showTr), title: T0.t(L.trShow), 'aria-label': T0.t(L.trShow), text: 'Aa' });
      trT.onclick = () => { showTr = !showTr; root.classList.toggle('show-tr', showTr); trT.setAttribute('aria-pressed', String(showTr)); };
      const pinT = E('button', { class: 't0-btn pm-tog', type: 'button', 'aria-pressed': String(showPins), title: T0.t(L.pins), 'aria-label': T0.t(L.pins), html: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="8" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 12.5V18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' });
      pinT.onclick = () => { showPins = !showPins; root.classList.toggle('no-pins', !showPins); pinT.setAttribute('aria-pressed', String(showPins)); };
      const zo = E('button', { class: 't0-btn', type: 'button', 'aria-label': T0.t(L.zoomOut), title: T0.t(L.zoomOut), text: '−' });
      const zi = E('button', { class: 't0-btn', type: 'button', 'aria-label': T0.t(L.zoomIn), title: T0.t(L.zoomIn), text: '+' });
      zo.disabled = zoom <= 1; zi.disabled = zoom >= 2.5;
      zo.onclick = () => setZoom(zoom - 0.5); zi.onclick = () => setZoom(zoom + 0.5);
      const dr = E('button', { class: 't0-btn', type: 'button', 'aria-label': T0.t(L.tr) }, E('span', { 'aria-hidden': 'true', text: '☰' }), E('span', { class: 'pm-hide-s', text: T0.t(L.tr) }));

    function setZoom(z) {

    /* ---------- trang ---------- */
    function drawPages() {
      closeBub();
      spread.innerHTML = '';
      spread.classList.toggle('zoomed', zoom > 1);
      spread.style.width = zoom > 1 ? (zoom * 100) + '%' : '';

      show.forEach((p) => spread.append(drawPage(p)));

    }
    function drawPage(p) {
      const ed = edition();
      const src = p.images[ed] || p.images[base] || Object.values(p.images)[0];
      const usedEd = p.images[ed] ? ed : (p.images[base] ? base : Object.keys(p.images)[0]);
      const aligned = usedEd === base; // tọa độ tr/pins thuộc bản gốc
      const pg = E('div', { class: 'pm-page', 'data-n': p.n, 'data-ed': usedEd });
      const img = E('img', { class: 'pm-img', alt: pageName(p), src: T0.asset(src), draggable: 'false', decoding: 'async' });
      img.onload = () => { if (img.naturalWidth) pg.style.setProperty('--ar', String(img.naturalWidth / img.naturalHeight)); };
      img.onerror = () => pg.append(E('div', { class: 'pm-missing', text: src + ' – ' + T0.s('not_found') }));
      pg.append(img, E('div', { class: 'pm-label', text: pageName(p) + (usedEd !== base ? ' · ' + usedEd.toUpperCase() : '') }));
      if (aligned) (p.tr || []).forEach((t, i) => {
        const [x, y, w, h] = t.box;
        const b = E('button', { class: 'pm-tr', type: 'button', style: { left: x + '%', top: y + '%', width: w + '%', height: h + '%' }, 'aria-label': T0.t(L.tr) + ': ' + T0.t(t.text).slice(0, 80), 'aria-expanded': 'false' });
        b.onclick = (e) => { e.stopPropagation(); toggleBub(pg, b, t); };
        pg.append(b);

      // ghim
      let pins = (p.pins || []).map((pin) => Object.assign({}, pin));
      if (!aligned) { // cột lề phải, giữ thứ tự theo y, giãn cách tối thiểu
        pins.sort((a, b) => a.y - b.y);

      requestAnimationFrame(() => spreadPins(pg));
      return pg;
    }
    // Ghim gần nhau hơn vùng chạm tối thiểu (vd. 3 ghim cách nhau 5% trên màn 390px) thì giãn ngang quanh tâm nhóm.
    function spreadPins(pg) {
      const W = pg.clientWidth, H = pg.clientHeight;
      if (!W || !H) return;
      const min = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--touch-min')) || 44;
      const bs = [...pg.querySelectorAll('.pm-pin')].map((b) => ({ b, x: parseFloat(b.dataset.x0 || b.style.left), y: parseFloat(b.dataset.y0 || b.style.top) }));
      bs.forEach((o) => { o.b.dataset.x0 = o.x; o.b.dataset.y0 = o.y; o.px = (o.x / 100) * W; o.py = (o.y / 100) * H; });
      const used = new Set();
      bs.slice().sort((a, b) => a.py - b.py || a.px - b.px).forEach((o) => {
        if (used.has(o)) return;
        const row = bs.filter((q) => !used.has(q) && Math.abs(q.py - o.py) < min).sort((a, b) => a.px - b.px);
        row.forEach((q) => used.add(q));
        if (row.length < 2) { o.b.style.left = o.x + '%'; return; }
        const pos = row.map((q) => q.px);
        for (let i = 1; i < pos.length; i++) pos[i] = Math.max(pos[i], pos[i - 1] + min);
        const shift = (row.reduce((s, q) => s + q.px, 0) - pos.reduce((s, v) => s + v, 0)) / row.length;
        let lo = pos[0] + shift, hi = pos[pos.length - 1] + shift, adj = 0;
        if (lo < min / 2) adj = min / 2 - lo; else if (hi > W - min / 2) adj = W - min / 2 - hi;
        row.forEach((q, i) => { q.b.style.left = ((pos[i] + shift + adj) / W * 100) + '%'; q.b.style.top = q.y + '%'; });
      });
    }
    function resolve(pin) {
      const r = pin.ref;
      switch (pin.kind) {
        case 'exercise': case 'quiz': case 'activity': case 'question': case 'workbook':
          return T0.find('exercise', r) ? 'exercise' : T0.find('simulation', r) ? 'simulation' : T0.find('figure', r) ? 'figure' : null;
        case 'figure': return T0.find('figure', r) ? 'figure' : T0.find('simulation', r) ? 'simulation' : null;
        case 'video': case 'story': return T0.find('video', r) ? 'video' : null;
        case 'simulation': case 'demo': return T0.find('simulation', r) ? 'simulation' : null;
        case 'audio': case 'text_anchor': return T0.find('clip', r) ? 'audio' : null;
        default: return null;
      }
    }
    function drawPin(pin, p) {
      const k = kindOf(pin.kind);
      const how = resolve(pin);
      const title = T0.t(k.l) + (pin.ref ? ' · ' + labelOf(pin, how) : '');
      const b = E('button', { class: 'pm-pin k-hit ' + pin.kind + (how ? '' : ' missing'), type: 'button', style: { left: pin.x + '%', top: pin.y + '%', '--pc': `var(${k.c})` }, 'aria-label': title, title, 'data-ref': pin.ref || '', 'data-kind': pin.kind, html: icon(pin.kind) });

      if (how === 'figure') inst = T0.renderSim(box, { kind: 'sim.figure_explorer', params: { figure: pin.ref } });

    // ----- phát -----
    function clipFor(s, lang) {
      const c = s.audio_ref && book.media && book.media.clips && book.media.clips[s.audio_ref];
      return c && c[lang] ? c[lang] : null;
    }
    function playOne(it) {
      const my = st.token;
      const lang = voiceLang();
      const s = it.s;
      const text = s[lang] || s.uz;
      return new Promise((res) => {
        let done = false;
        const fin = () => { if (done) return; done = true; clearTimeout(st.timer); res(my === st.token); };
        let r = null;
        try {
          if (T0.media && T0.media.play) {
            // core: play(clipId, {lang, rate, text, onEnd}) -> Promise; không có file → giọng trình duyệt đọc `text`
            r = T0.media.play(s.audio_ref || null, { lang, rate: st.rate, text: s, onEnd: fin });
          }
        } catch (e) { r = null; }
        if (r && typeof r.then === 'function') r.then(fin, fin);
        // dự phòng khi core không báo kết thúc: ước lượng theo dur của clip / độ dài câu
        const c = clipFor(s, lang);
        const ms = (c ? c.dur * 1000 : Math.max(1500, text.length * 70)) / st.rate;
        st.timer = setTimeout(fin, ms + 4000);
      });
    }
    function stop() {
      st.token++; st.playing = false; clearTimeout(st.timer);
      try { T0.media && T0.media.stop && T0.media.stop(); } catch (e) { /* bỏ qua */ }
      syncBar();
    }
    async function playFrom(idx, single) {
      stop();
      const my = ++st.token;
      st.playing = true; syncBar();
      let i = idx;
      while (i < model.sents.length && my === st.token) {
        const it = model.sents[i];
        if (it.readable) {
          setCur(i, true);
          const ok = await playOne(it);
          if (!ok || my !== st.token) return;
          if (single) break;
        }
        i++;
      }
      if (my === st.token) { st.playing = false; syncBar(); }
    }
    function nextReadable(from, dir) {
      for (let i = from + dir; i >= 0 && i < model.sents.length; i += dir) if (model.sents[i].readable) return i;
      return -1;
    }

    // ----- tô sáng -----
    function setCur(i, scroll) {
      st.cur = i;
      root.querySelectorAll('.r-cur').forEach((n) => { n.classList.remove('r-cur'); n.removeAttribute('aria-current'); });
      root.querySelectorAll('.r-curp').forEach((n) => n.classList.remove('r-curp'));
      const it = model.sents[i];
      if (!it) return;
      const nodes = root.querySelectorAll('[data-k="' + CSS_ESC(it.key) + '"]');
      nodes.forEach((n) => {
        if (n.classList.contains('r-ln')) n.classList.add('r-curp');
        else { n.classList.add('r-cur'); n.setAttribute('aria-current', 'true'); }
      });
      if (scroll && nodes[0] && nodes[0].scrollIntoView) {
        try { nodes[0].scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); } catch (e) { /* bỏ qua */ }
      }
    }
    const CSS_ESC = (s) => (window.CSS && CSS.escape ? CSS.escape(s) : s.replace(/"/g, '\\"'));

    // ----- chú giải -----
    function openGloss(ids) {
      const list = (book.glossary || []).filter((g) => !ids || ids.includes(g.id));
      const box = h('div', 'r-gloss-pop');
      const dl = h('dl');
      list.forEach((g) => {
        const sh = g.short && g.short[T0.lang];
        dl.appendChild(h('dt', null, esc(tt(g.term)) + (sh ? ' <span class="r-short">— ' + esc(sh) + '</span>' : '')));
        dl.appendChild(h('dd', null, esc(tt(g.definition))));
      });
      box.appendChild(dl);
      if (T0.ui && T0.ui.modal) T0.ui.modal(box, { title: tt(S.glossary) });
    }

    // ----- dựng -----
    function render() {
      stop();
      root.innerHTML = '';
      lesson = lessons.find((l) => l.id === st.lessonId);
      if (!lesson) { root.appendChild(h('div', 'r-empty', esc(tt(S.no_text)))); return; }
      unit = (book.units || []).find((u) => u.id === lesson.unit) || null;
      model = buildModel(book, lesson);
      const gm = glossMatchers(book, unit && unit.id);
      const showTr = st.showTr && T0.lang !== base;
      const trOf = (s) => (showTr && s[T0.lang] ? '<span class="r-tr" lang="' + T0.lang + '">' + esc(s[T0.lang]) + '</span>' : '');

      // đầu đơn vị: ảnh cắt từ trang (hero) + tên + phụ đề
      const hero = unit && unit.hero;
      const pg = hero && (book.pages || []).find((p) => p.n === hero.page);
      const himg = pg && pg.images && (pg.images[T0.lang] || pg.images[base] || Object.values(pg.images)[0]);
      if (himg && hero.box) {
        const [x, y, w, hh] = hero.box; const PW = (book.print_text && book.print_text.width) || 595, PH = (book.print_text && book.print_text.height) || 842;
        const d = h('div', 'r-hero'); d.style.aspectRatio = (w * PW) / (hh * PH);
        const im = new Image(); im.alt = ''; im.decoding = 'async'; im.loading = 'lazy'; im.src = assetUrl(book, himg);
        im.style.width = (10000 / w) + '%'; im.style.top = (-y / hh * 100) + '%'; im.style.left = (-x / w * 100) + '%';
        d.appendChild(im); root.appendChild(d);
      }
      const head = h('div', 'r-head');
      head.appendChild(h('h2', null, esc(tt((unit && unit.title) || lesson.title))));
      if (unit && unit.subtitle) head.appendChild(h('p', 'r-sub', esc(tt(unit.subtitle))));
      root.appendChild(head);

      // hàng chọn: bài (nếu nhiều), xem văn bản / trang, bản dịch, chú giải
      const meta = h('div', 'r-meta');
      if (lesson.page_range) meta.appendChild(h('span', null, esc(tt(S.pages)) + ' ' + lesson.page_range[0] + '–' + lesson.page_range[1]));
      if (lessons.length > 1) {
        const sel = document.createElement('select'); sel.className = 'r-chip'; sel.setAttribute('aria-label', tt(S.lesson));
        lessons.forEach((l) => { const o = document.createElement('option'); o.value = l.id; o.textContent = tt(l.title); if (l.id === st.lessonId) o.selected = true; sel.appendChild(o); });
        sel.onchange = () => { st.lessonId = sel.value; sset('reading:lesson', sel.value); render(); };
        meta.appendChild(sel);
      }
      const hasPage = (book.pages || []).some((p) => p.text_lines && p.text_lines.length && lesson.page_range && p.n >= lesson.page_range[0] && p.n <= lesson.page_range[1]);
      const seg = h('span', 'r-seg');
      [['text', S.view_text], ['page', S.view_page]].forEach(([v, lab]) => {
        if (v === 'page' && !hasPage) return;
        const b = h('button', 'r-chip', esc(tt(lab))); b.type = 'button'; b.setAttribute('aria-pressed', String(st.view === v));
        b.onclick = () => { st.view = v; sset('reading:view', v); render(); };
        seg.appendChild(b);
      });
      if (seg.children.length > 1) meta.appendChild(seg);
      if (T0.lang !== base) {
        const b = h('button', 'r-chip', esc(tt(S.translation))); b.type = 'button'; b.setAttribute('aria-pressed', String(st.showTr));
        b.onclick = () => { st.showTr = !st.showTr; sset('reading:showTr', st.showTr); render(); };
        meta.appendChild(b);
      }
      if ((book.glossary || []).some((g) => !unit || !g.unit || g.unit === unit.id)) {
        const b = h('button', 'r-chip', esc(tt(S.glossary))); b.type = 'button';
        b.onclick = () => openGloss((book.glossary || []).filter((g) => !unit || !g.unit || g.unit === unit.id).map((g) => g.id));
        meta.appendChild(b);
      }
      if (T0.tutor && T0.tutor.open) {
        const b = h('button', 'r-chip', esc(tt(S.ask))); b.type = 'button';
        b.onclick = () => {
          const it = model.sents[st.cur];
          const blk = it ? it.block : null;
          // context = tham số ghi đè cho mẫu gia-su/prompts.json ({{context}}, {{current_chapter}})
          T0.tutor.open({ role: 'chat', context: { context: (blk ? blockText(blk) : lessonText(lesson, null)).slice(0, 7000), current_chapter: tt((unit && unit.title) || lesson.title) + (unit && unit.subtitle ? ' — ' + tt(unit.subtitle) : '') } });
        };
        meta.appendChild(b);
      }
      root.appendChild(meta);
      if (model.readable.length) root.appendChild(h('p', 'r-hint', esc(tt(S.tap_hint))));

      if (st.view === 'page' && hasPage) renderPages(); else renderText(gm, trOf);
      renderBar();
      if (st.cur >= 0) setCur(st.cur, false);
    }

    function sentHtml(it, gm, cls) {
      const s = it.s;
      const on = it.readable ? ' r-on' : ' r-nr';
      const attrs = ' data-k="' + esc(it.key) + '" lang="' + base + '"' + (it.readable ? ' role="button" tabindex="0" aria-label="' + esc(tt(S.play) + ': ' + (s[base] || s.uz)) + '"' : '');
      return '<span class="' + (cls || 'r-s') + on + '"' + attrs + '>' + markGloss(s[base] || s.uz, gm) + '</span>';
    }

    function renderText(gm, trOf) {
      const keyOf = (bid, sfx) => model.byKey[bid + sfx];
      (lesson.blocks || []).forEach((b, bi) => {
        if (b.type === 'poem') {
          const d = h('section', 'r-block r-poem');
          const ti = keyOf(b.id, '/title');
          if (ti) d.appendChild(h('h3', null, sentHtml(ti, gm) + trOf(ti.s)));
          (b.stanzas || []).forEach((stz, i) => {
            const sd = h('div', 'r-stanza');
            stz.forEach((_, j) => { const it = keyOf(b.id, '/stanzas/' + i + '/' + j); sd.insertAdjacentHTML('beforeend', sentHtml(it, gm, 'r-s r-line') .replace('</span>', '') + trOf(it.s) + '</span>'); });
            d.appendChild(sd);
          });
          root.appendChild(d);
        } else if (b.type === 'text' || b.type === 'prose') {
          const d = h('section', 'r-block r-text');
          const ti = !b.untitled && keyOf(b.id, '/title');
          if (ti && b.type === 'prose') d.appendChild(h('h3', null, sentHtml(ti, gm) + trOf(ti.s)));
          (b.paras || []).forEach((_, i) => {
            const it = keyOf(b.id, '/paras/' + i);
            const p = h('p', null, sentHtml(it, gm)); d.appendChild(p);
            const tr = trOf(it.s); if (tr) d.insertAdjacentHTML('beforeend', tr.replace('class="r-tr"', 'class="r-tr" style="display:block"'));
          });
          root.appendChild(d);
        } else if (b.type === 'exercise') {
          (b.exercise_refs || []).forEach((rid) => {
            const ex = (book.exercises || []).find((e) => e.id === rid);
            if (!ex) return;
            const card = h('section', 'r-block r-ex');
            card.id = 'r-ex-' + rid.replace(/[^\w-]/g, '_');
            const hd = h('div', 'r-ex-h', esc(rubricLabel(b.rubric) || tt(S.exercise)) + (ex.page ? ' <span class="r-tag">' + esc(tt(S.page)) + ' ' + ex.page + '</span>' : ''));
            card.appendChild(hd);
            const body = h('div'); card.appendChild(body);
            root.appendChild(card);
            const exCtx = {
              // không truyền book/lang: makeCtx của core định nghĩa chúng là getter (Object.assign sẽ lỗi)
              mode: 'reading', variant: 'lesson_block', lesson: lesson.id, block: b.id,
              ai_context: (ex.ai_feedback && ex.ai_feedback.context === 'preceding_text') ? lessonText(lesson, bi).slice(-7000) : null
            };
            try { if (T0.renderEx) T0.renderEx(body, ex, exCtx); else body.textContent = ex.kind; } catch (e) { body.textContent = '⚠ ' + ex.kind; console.error('[reading] renderEx', ex.kind, e); }
          });
        }
      });
    }

    function rubricLabel(code) {
      // nhãn mục theo bộ sách: T0.blocks.rubric (R2, từ tri-thuc/rubric-bo-sach.json); không có thì để trống
      try { const r = T0.blocks && T0.blocks.rubric && T0.blocks.rubric(code); if (r && r.label) return tt(r.label); } catch (e) { /* bỏ qua */ }
      return '';
    }
    function blockText(b) {
      const out = [];
      if (b.title) out.push(b.title.uz);
      (b.paras || []).forEach((s) => out.push(s.uz));
      (b.stanzas || []).forEach((stz) => { stz.forEach((s) => out.push(s.uz)); out.push(''); });
      return out.join('\n');
    }
    function lessonText(l, uptoIdx) {
      return (l.blocks || []).filter((b, i) => READ_TYPES[b.type] && (uptoIdx == null || i < uptoIdx)).map(blockText).join('\n\n');
    }

    // ----- trang dựng lại chữ thật: ảnh nền đã xoá chữ + SVG text_lines -----
    function renderPages() {
      const pt = book.print_text || {};
      const W = pt.width || 595, H = pt.height || 842, styles = pt.styles || [];
      const anchors = (book.reading && book.reading.anchors) || [];
      const anchorByIdx = {};
      const anchorById = {};
      anchors.forEach((a) => { anchorById[a.id] = a; const m = /(\d+)$/.exec(a.id || ''); if (m) anchorByIdx[m[1]] = a; });
      (book.pages || []).filter((p) => p.text_lines && lesson.page_range && p.n >= lesson.page_range[0] && p.n <= lesson.page_range[1]).forEach((p) => {
        const wrap = h('div', 'r-page');
        wrap.setAttribute('aria-label', tt(S.page) + ' ' + (p.label || p.n));
        const groups = new Map(); const plain = [];
        const seen = new Set();
        p.text_lines.forEach((l) => {
          const key = l[0] + ',' + l[1] + ',' + l[5];
          if (seen.has(key)) return; seen.add(key); // dòng in trùng (lớp in chồng)
          // D2: ưu tiên anchor_id (phần tử 8); thiếu thì ghép theo đuôi số của id (cách cũ)
          const an = (l[7] && anchorById[l[7]]) || (l[6] >= 0 ? anchorByIdx[l[6]] : null);
          if (an) { const k = an.target; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); }
          else plain.push(l);
        });
        const tx = (l) => {
          const s = styles[l[4]] || [];
          const four = s.length >= 4; const bold = four ? s[1] : s[0], ital = four ? s[2] : s[1], col = s[s.length - 1] || '#231f20';
          return '<text x="' + l[0] + '" y="' + l[1] + '" font-size="' + l[3] + '" textLength="' + l[2] + '" lengthAdjust="spacingAndGlyphs" fill="' + esc(col) + '"' + (bold ? ' font-weight="700"' : '') + (ital ? ' font-style="italic"' : '') + '>' + esc(l[5]) + '</text>';
        };
        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img">';
        if (p.background) svg += '<image href="' + esc(assetUrl(book, p.background)) + '" x="0" y="0" width="' + W + '" height="' + H + '" preserveAspectRatio="none"/>';
        svg += plain.filter((l) => l[1] < H - 2).map(tx).join('');
        groups.forEach((ls, k) => {
          const it = model.byKey[k];
          const rd = it && it.readable;
          const rects = ls.map((l) => '<rect x="' + (l[0] - 2) + '" y="' + (l[1] - l[3] * 0.95) + '" width="' + (l[2] + 4) + '" height="' + (l[3] * 1.3) + '" rx="2"/>').join('');
          svg += '<g class="' + (rd ? 'r-ln' : 'r-lnx') + '" data-k="' + esc(k) + '"' + (rd ? ' role="button" tabindex="0" aria-label="' + esc(tt(S.play) + ': ' + (it.s.uz || '')) + '"' : '') + '>' + rects + ls.map(tx).join('') + '</g>';
        });
        svg += '</svg>';
        wrap.innerHTML = svg;
        root.appendChild(wrap);
      });
      if (!root.querySelector('.r-page')) root.appendChild(h('div', 'r-empty', esc(tt(S.no_page))));
    }

    // ----- thanh điều khiển -----
    let bar = null;
    function renderBar() {
      bar = h('div', 'r-bar');
      bar.setAttribute('role', 'toolbar'); bar.setAttribute('aria-label', tt(S.label));
      const mk = (cls, label, txt, fn) => { const b = h('button', 'r-chip ' + cls, txt); b.type = 'button'; b.setAttribute('aria-label', label); b.title = label; b.onclick = fn; bar.appendChild(b); return b; };
      mk('r-prev', tt(S.prev), '‹', () => { const i = nextReadable(st.cur < 0 ? -1 : st.cur, -1); if (i >= 0) { if (st.playing) playFrom(i); else setCur(i, true); } });
      mk('r-main', tt(S.play), '▶ <span class="r-mt">' + esc(tt(S.play)) + '</span>', () => {
        if (st.playing) { stop(); return; }
        const start = st.cur >= 0 && model.sents[st.cur] && model.sents[st.cur].readable ? st.cur : nextReadable(-1, 1);
        if (start >= 0) playFrom(start);
      });
      mk('r-next', tt(S.next), '›', () => { const i = nextReadable(st.cur, 1); if (i >= 0) { if (st.playing) playFrom(i); else setCur(i, true); } });
      // tốc độ
      const g1 = h('span', 'r-grp'); g1.appendChild(h('span', 'r-lbl', esc(tt(S.speed))));
      const sel = document.createElement('select'); sel.className = 'r-rate'; sel.setAttribute('aria-label', tt(S.speed));
      RATES.forEach((r) => { const o = document.createElement('option'); o.value = r; o.textContent = r + '×'; if (r === st.rate) o.selected = true; sel.appendChild(o); });
      sel.onchange = () => { st.rate = +sel.value; if (T0.media && T0.media.setRate) T0.media.setRate(st.rate); if (st.playing && st.cur >= 0) playFrom(st.cur); };
      g1.appendChild(sel); bar.appendChild(g1);
      // giọng: bản gốc / bản dịch (chỉ khi giao diện khác ngôn ngữ gốc)
      if (T0.lang !== base) {
        const g2 = h('span', 'r-grp r-seg'); g2.appendChild(h('span', 'r-lbl', esc(tt(S.voice))));
        [['orig', base.toUpperCase()], ['tr', T0.lang.toUpperCase()]].forEach(([v, lab]) => {
          const b = h('button', 'r-chip r-voice', esc(lab)); b.type = 'button'; b.setAttribute('aria-pressed', String(st.voice === v));
          b.setAttribute('aria-label', tt(S.voice) + ': ' + (v === 'orig' ? tt(S.original) : tt(S.translation)));
          b.onclick = () => { st.voice = v; sset('reading:voice', v); g2.querySelectorAll('.r-voice').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); if (st.playing && st.cur >= 0) playFrom(st.cur); };
          g2.appendChild(b);
        });
        bar.appendChild(g2);
      }
      root.appendChild(bar);
      syncBar();
    }
    function syncBar() {
      if (!bar) return;
      const m = bar.querySelector('.r-main');
      if (m) { m.innerHTML = (st.playing ? '❚❚ ' : '▶ ') + '<span class="r-mt">' + esc(tt(st.playing ? S.pause : S.play)) + '</span>'; m.setAttribute('aria-label', st.playing ? tt(S.pause) : tt(S.play)); m.setAttribute('aria-pressed', String(st.playing)); }
    }

    // ----- sự kiện -----
    function onClick(e) {
      const g = e.target.closest && e.target.closest('.r-gl');
      if (g) { e.stopPropagation(); openGloss([g.dataset.g]); return; }
      const n = e.target.closest && e.target.closest('[data-k].r-on, [data-k].r-ln');
      if (n && root.contains(n)) {
        const it = model.byKey[n.getAttribute('data-k')];
        if (it && it.readable) playFrom(it.idx, true);
      }
    }
    function onKey(e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const n = e.target.closest && e.target.closest('[data-k].r-on, [data-k].r-ln');
      if (n) { e.preventDefault(); onClick({ target: n, stopPropagation() {} }); }
    }
    let q = 0;
    const onLang = () => { if (q) return; q = requestAnimationFrame(() => { q = 0; render(); }); };
    const onRate = (e) => { const r = e && e.detail && +e.detail.rate; if (r) { st.rate = r; const sl = root.querySelector('.r-rate'); if (sl) sl.value = String(RATES.includes(r) ? r : 1); } };
    root.addEventListener('click', onClick);
    root.addEventListener('keydown', onKey);
    document.addEventListener('t0:lang', onLang);
    document.addEventListener('t0:rate', onRate);

    render();
    if (tgKey && model && model.byKey[tgKey]) setCur(model.byKey[tgKey].idx, true);

    return {
      unmount() {
        stop();
        document.removeEventListener('t0:lang', onLang);
        document.removeEventListener('t0:rate', onRate);
        if (q) cancelAnimationFrame(q);
        root.remove();
      },
      // dùng cho kiểm thử/ghim nhảy tới câu
      _state: st, _play: (k) => { const it = model && model.byKey[k]; if (it) playFrom(it.idx, true); }
    };
  }

  const def = { label: S.label, available, mount };
  if (typeof T0.registerMode === 'function') T0.registerMode('reading', def);
  else { (T0._pendingModes = T0._pendingModes || []).push(['reading', def]); }
  T0._reading = { buildModel, glossMatchers, markGloss, available };
})();

</script>

ẫn) vẫn dùng bình thường.","ru":"Беседа с искусственным интеллектом работает, только когда книга открыта в Claude. Остальная помощь (задания, напоминания, инструкция) продолжает работать."},"denied":{"uz":"Ruxsat berilmadi, shuning uchun savolga javob bera olmayman. Keyinroq sahifani qayta ochib, ruxsat bering.","vi":"Chưa được cho phép nên mình chưa trả lời được. Em hãy mở lại trang và bấm cho phép nhé.","ru":"Разрешение не получено, поэтому я не могу ответить на вопрос. Позже открой страницу заново и дай разрешение."},"busy":{"uz":"Hozir savollar juda ko‘p. Birozdan keyin yana so‘rang.","vi":"Lúc này có quá nhiều câu hỏi. Em thử lại sau một lúc nhé.","ru":"Сейчас очень много вопросов. Спроси ещё раз чуть позже."},"fail":{"uz":"Javob bera olmadim. Savolni boshqacha yozib ko‘ring.","vi":"Mình chưa trả lời được. Em thử hỏi cách khác nhé.","ru":"Я не смог ответить. Попробуй написать вопрос по-другому."},"thinking":{"uz":"O‘ylayapman…","vi":"Đang nghĩ…","ru":"Думаю…"},"error_codes":{"not_granted":"denied","rate_limited":"busy","queue_overflow":"busy","other":"fail"},"sources":[{"book":"matematika5","code":"TX / RRU"},{"book":"informatika5","code":"TX / RRU"},{"book":"tabiiy5","code":"TX / RRU"},{"book":"biologiya5","code":"TX / RRU"},{"book":"kimyo8","code":"TX / RRU"},{"book":"fizika8","code":"TX / RRU"},{"book":"adabiyot5","code":"UI: hello, noai, thinking"}]}};

е ли вы привести примеры элементов со сходными химическими свойствами?","vi":"Câu hỏi của bài: em có tìm được ví dụ về các nguyên tố có tính chất hoá học giống nhau không?"}},{"box":[8,31,80.7,12.4],"text":{"uz":"Na va K juda o‘xshash: yumshoq, suvdan yengil, kislorod va suv bilan oddiy sharoitda shiddatli reaksiyaga kirishadi, birikmalarida I valentli.","ru":"Na и K очень похожи: мягкие, легче воды, бурно реагируют с кислородом и водой при обычных условиях, в соединениях одновалентны.","vi":"Na và K rất giống nhau: mềm, nhẹ hơn nước, phản ứng mãnh liệt với oxi và nước ở điều kiện thường, trong hợp chất có hoá trị I."}},{"box":[8,44.1,80.7,14],"text":{"uz":"2Na + O₂ = Na₂O₂, 2K + O₂ = K₂O₂; 2Na + 2H₂O = 2NaOH + H₂↑, 2K + 2H₂O = 2KOH + H₂↑. Li, Rb, Cs, Fr ham shunday — bular ishqoriy metallar oilasi.","ru":"2Na + O₂ = Na₂O₂, 2K + O₂ = K₂O₂; 2Na + 2H₂O = 2NaOH + H₂↑, 2K + 2H₂O = 2KOH + H₂↑. Li, Rb, Cs, Fr ведут себя так же — это семейство щелочных металлов.","vi":"2Na + O₂ = Na₂O₂, 2K + O₂ = K₂O₂; 2Na + 2H₂O = 2NaOH + H₂↑, 2K + 2H₂O = 2KOH + H₂↑. Li, Rb, Cs, Fr cũng vậy — đó là họ kim loại kiềm."}},{"box":[11.7,58.7,76,2.4],"text":{"uz":"2- jadval. Ishqoriy metallarning xossalari","ru":"Таблица 2. Свойства щелочных металлов","vi":"Bảng 2. Tính chất của các kim loại kiềm"},"heading":true},{"box":[9.4,62.4,73.9,4.6],"text":{"uz":"Jadval ustunlari: element nomi, belgisi, nisbiy atom massasi Ar, valentligi, oksidi, gidroksidi va tuzlari.","ru":"Столбцы таблицы: название элемента, символ, относительная атомная масса Ar, валентность, оксид, гидроксид и соли.","vi":"Các cột của bảng: tên nguyên tố, kí hiệu, nguyên tử khối Ar, hoá trị, oxit, hiđroxit và muối."}},{"box":[9.5,68.2,76.4,19.1],"text":{"uz":"Li (6,9), Na (23), K (39,1), Rb (85,5), Cs (132,9) — hammasi I valentli. Formulalar bir xil qolipda: R₂O, ROH, RCl, R₂SO₄.","ru":"Li (6,9), Na (23), K (39,1), Rb (85,5), Cs (132,9) — все одновалентны. Формулы построены одинаково: R₂O, ROH, RCl, R₂SO₄.","vi":"Li (6,9), Na (23), K (39,1), Rb (85,5), Cs (132,9) — tất cả đều hoá trị I. Công thức theo cùng một khuôn: R₂O, ROH, RCl, R₂SO₄."}},{"box":[12.6,88.4,60.5,2.6],"text":{"uz":"Keyingi betda ishqoriy metallarning umumiy xossalari sanab o‘tiladi.","ru":"На следующей странице перечислены общие свойства щелочных металлов.","vi":"Trang sau liệt kê các tính chất chung của kim loại kiềm."}}],"pins":[{"kind":"exercise","ref":"p21.q5","x":8.1,"y":12.9},{"kind":"video","ref":"video.i4","x":24,"y":23.5},{"kind":"video","ref":"video.t4","x":80.7,"y":22.85},{"kind":"quiz","ref":"t4.quiz","x":86.2,"y":22.85},{"kind":"activity","ref":"t4.model","x":91.2,"y":22.85}],"ocr":{"ru":["ПЕРИОДИЧЕСКИЙ ЗАКОН И ПЕРИОДИЧЕСКАЯ ТАБЛИЦА ЭЛЕМЕНТОВ. СТРОЕНИЕ АТОМА - @","С глАВА п) — 84° ЭЛЕМЕНТОВ","ПРИРОДНЫЕ СЕМЕЙСТВА ХИМИЧЕСКИХ","Приведите примеры элементов со схожими химическими свойствами При изучении свойств водорода, кислорода и воды вы познакомились с элементами, которые проявляют одинаковые свойства. Например, металлы натрий и калий мягкие, легче воды, в обычных условиях интенсивно реагируют с кислородом и водой, в результате чего образуют одновалентные соединения: 2М№ а + О, = Ма.О,, 2К + О, = К.О,, 2Ма + 2Н.О = 2МаОН + Н,, 2К +2Н,О = КОН + Н.. Металлы 14, ВЬ, Сз и Ег по своим свойствам также по-","хожи на Маи К. Все они составляют одно семейство — семейство щелочных металлов (табл. 2). .. Таблица 2 Свойства щелочных металлов Хими- | Относитель- .. Валент- Гидрок- Элемент | ческий | ная атомная Оксид Соль НОСТЬ сид символ масса А, Литий Та 6,9 Т О ГОН С, 11,50, Натрий Ма 23 т Ма.О | МаОН | Мас, Ма,$О, Калий к 39,1 т К.О КОН кс, К,5О, Рубидий ВЬ 85,5 1 В.О ВЬОН | В.С, ВЬ,$0, Цезий Сз 132,9 т Сз.О С$ОН | С$С1, С$,$0,","Щелочные металлы имеют следующие общие свойства:"]}},{"n":37,"volume":"tb","label":"37","images":{"uz":"pages/p037.jpg","ru":"@ru_pages/pages_ru/p037.jpg"},"tr":[{"box":[10.9,32.6,35.7,4.5],"text":{"uz":"4- rasm. Kislorod atomining tuzilishi.","ru":"Рис. 4. Строение атома кислорода.","vi":"Hình 4. Cấu tạo nguyên tử oxi."}},{"box":[50.2,12.2,38.4,22.2],"text":{"uz":"Xulosa: atom — neytral zarracha. Yadrosi proton va neytronlardan iborat, elektronlar soni esa protonlar soniga teng.","ru":"Вывод: атом — нейтральная частица. Ядро состоит из протонов и нейтронов, а число электронов равно числу протонов.","vi":"Kết luận: nguyên tử là hạt trung hoà điện. Hạt nhân gồm proton và nơtron, còn số electron bằng số proton."}},{"box":[50.2,34.3,38.6,9.2],"text":{"uz":"Eslab qoling: atom, yadro, proton, neytron, elektron, yadro zaryadi, tartib raqami.","ru":"Запомните: атом, ядро, протон, нейтрон, электрон, заряд ядра, порядковый номер.","vi":"Cần nhớ: nguyên tử, hạt nhân, proton, nơtron, electron, điện tích hạt nhân, số thứ tự."}},{"box":[23.9,47.5,31.6,2.2],"text":{"uz":"SAVOL VA TOPSHIRIQLAR","ru":"ВОПРОСЫ И ЗАДАНИЯ","vi":"CÂU HỎI VÀ BÀI TẬP"},"heading":true},{"box":[11.6,72.6,58.3,4.1],"text":{"uz":"8-§. IZOTOPLAR. IZOBARLAR","ru":"§ 8. ИЗОТОПЫ. ИЗОБАРЫ","vi":"§ 8. ĐỒNG VỊ. ĐỒNG KHỐI"},"heading":true},{"box":[10.9,77.6,74.7,5],"text":{"uz":"O‘ylab ko‘ring: vodorod atomi massasi geliy atomi massasiga deyarli teng bo‘la oladimi?","ru":"Подумайте: может ли атом водорода иметь почти такую же массу, как атом гелия?","vi":"Hãy nghĩ xem: nguyên tử hiđro có thể nặng gần bằng nguyên tử heli không?"}},{"box":[8,84.9,80.5,7.5],"text":{"uz":"Proton va neytron massalari butun songa yaqin. Unda nega elementlarning atom massalari kasr son? (Javobi keyingi betda.)","ru":"Массы протона и нейтрона близки к целым числам. Почему же атомные массы элементов дробные? (Ответ на следующей странице.)","vi":"Khối lượng proton và nơtron gần bằng số nguyên. Vậy tại sao nguyên tử khối của các nguyên tố lại là số thập phân? (Lời giải ở trang sau.)"}}],"pins":[{"kind":"exercise","ref":"p37.q1","x":8.1,"y":53.8},{"kind":"exercise","ref":"p37.q2","x":12.9,"y":53.8},{"kind":"exercise","ref":"p37.q3","x":17.7,"y":53.8},{"kind":"exercise","ref":"p37.q4","x":22.5,"y":53.8},{"kind":"figure","ref":"p37.rasm4" aOH = Na₂BeO₂ + 2H₂O. Из 1 моль гидроксида — 1 моль соли, значит n = 0,1 моль.","vi":"Be(OH)₂ + 2NaOH = Na₂BeO₂ + 2H₂O. 1 mol hiđroxit cho 1 mol muối, vậy n = 0,1 mol."}},{"label":"g","answer":"8.7|8,7","kind":"ex.short_answer","solution":{"uz":"M(Na₂BeO₂) = 2·23 + 9 + 2·16 = 87 g/mol; m = 0,1 · 87 = 8,7 g.","ru":"M(Na₂BeO₂) = 2·23 + 9 + 2·16 = 87 г/моль; m = 0,1 · 87 = 8,7 г.","vi":"M(Na₂BeO₂) = 2·23 + 9 + 2·16 = 87 g/mol; m = 0,1 · 87 = 8,7 g."}}],"placement":["modal"],"ai_feedback":{"role":"hint"}},{"id":"p37.q1","legacy_ids":["p37.ex0"],"kind":"ex.open_response","no":"1","page":37,"volume":"tb","box":[10.3,52.5,78.2,15.8],"prompt":{"uz":"Atom haqida qaysi olimlar fikr bildirgan? Ular nima degan?","ru":"Какие учёные высказывались об атоме? Что они утверждали?","vi":"Những nhà bác học nào đã nêu ý kiến về nguyên tử? Họ nói gì?"},"items":[{"label":"","open":true,"kind":"ex.open_response","solution":{"uz":"Demokrit: atom bo‘linmaydi. Ar-Roziy va Beruniy: atom bo‘linadi. Rezerford (1911): atomda yadro bor, planetar model.","ru":"Демокрит: атом неделим. Ар-Рази и Беруни: атом делим. Резерфорд (1911): в атоме есть ядро, планетарная модель.","vi":"Đêmôcrit: nguyên tử không chia được. Ar-Roziy và Beruniy: nguyên tử chia được. Rezerford (1911): nguyên tử có hạt nhân, mẫu hành tinh."}}],"placement":["modal"],"ai_feedback":{"role":"hint"}},{"id":"p37.q2","legacy_ids":["p37.ex1"],"kind":"ex.open_response","no":"2","page":37,"volume":"tb","box":[10.3,52.5,78.2,15.8],"prompt":{"uz":"Rezerford tajribasiga ko‘ra atom qanday tuzilgan?","ru":"Как устроен атом согласно опыту Резерфорда?","vi":"Theo thí nghiệm của Rezerford, nguyên tử có cấu tạo thế nào?"},"items":[{"label":"","open":true,"kind":"ex.open_response","solution":{"uz":"Markazda juda kichik, og‘ir musbat yadro, atrofida manfiy elektronlar; atomning ko‘p qismi bo‘shliq.","ru":"В центре очень маленькое тяжёлое положительное ядро, вокруг — отрицательные электроны; большая часть атома пуста.","vi":"Ở tâm là hạt nhân dương rấ привлекают насекомых? Почему?"}],"lesson_refs":["l11"]}],"lessons":[{"id":"l11","unit":"ch1","no":"1.1","page":9,"title":{"uz":"Gul","vi":"Hoa","ru":"Цветок"},"kind":"lesson","blocks":[{"id":"l11-0","type":"list","rubric":"objectives","items":[{"uz":"gulli o‘simliklarga ta’rif berasiz va misollar keltirasiz;","vi":"nêu được định nghĩa thực vật có hoa và lấy ví dụ;","ru":"дадите определение цветковым растениям и приведёте примеры;"},{"uz":"gul qismlarini aniqlaysiz;","vi":"xác định được các bộ phận của hoa;","ru":"определите части цветка;"},{"uz":"gul qismlarining vazifasini tavsiflaysiz;","vi":"mô tả được chức năng các bộ phận của hoa;","ru":"опишете функции частей цветка;"},{"uz":"tirik organizmlarni kuzatish natijalariga asoslanib tasniflaysiz;","vi":"phân loại sinh vật dựa trên kết quả quan sát;","ru":"классифицируете живые организмы на основе результатов наблюдений;"},{"uz":"kalit-aniqlagichni to‘ldirasiz;","vi":"hoàn thành khóa phân loại dựa trên những điểm khác nhau quan sát được;","ru":"заполните определительный ключ;"},{"uz":"modelda obyektning asosiy xususiyatlari aks etishini anglaysiz.","vi":"hiểu rằng mô hình thể hiện những đặc điểm chính của đối tượng.","ru":"поймёте, что модель отражает основные свойства объекта."}],"checkable":false,"audio_ref":"l11-b0"},{"id":"l11-1","type":"prompt","rubric":"think","paras":[{"uz":"Gul qanday tuzilgan?","vi":"Hoa có cấu tạo như thế nào?","ru":"Как устроен цветок?"}],"audio_ref":"l11-b1"},{"id":"l11-2","type":"text","rubric":"explore","title":{"uz":"Barcha o‘simliklar gul hosil qiladimi?","vi":"Có phải mọi loài cây đều ra hoa?","ru":"Все ли растения образуют цветки?"},"paras":[{"uz":"Kichik guruhlarga bo‘linib, o‘qituvchi boshchiligida maktab bog‘i bo‘ylab sayr qilishingiz mumkin.","vi":"Chia thành nhóm nhỏ, cùng thầy cô đi dạo quanh vườn trường.","ru":"Разделившись на небольшие группы, вы можете прогуляться по школьному саду под руководством учителя."},{"uz":"O‘simliklar qaysi xususiyatlari bilan boshqa organizmlardan farq qiladi? Barcha o‘simliklar uchun xos bo‘lgan qismlarni ayting.","vi":"Thực vật khác các sinh vật khác ở những đặc điểm nào? Hãy kể các bộ phận mà mọi cây đều có.","ru":"Какими признаками растения отличаются от других организмов? Назовите части, характерные для всех растений."},{"uz":"Kalit-aniqlagichni to‘ldiring: har bir o‘simlikni to‘g‘ri guruhga qo‘ying.","vi":"Hoàn thành khóa phân loại: xếp mỗi cây vào đúng nhóm.","ru":"Заполните определительный ключ: поместите каждое растение в правильную группу."}],"exercise_refs":["key11"],"audio_ref":"l11-b2"},{"id":"l11-3","type":"text","rubric":"learn","title":{"uz":"Qanday o‘simliklar “gulli o‘simliklar” deb ataladi?","vi":"Những cây nào được gọi là “thực vật có hoa”?","ru":"Какие растения называются «цветковыми растениями»?"},"paras":[{"uz":"O‘simliklar ildiz, poya va barg kabi qismlar – organlarga ega ekanini bilasiz. Ko‘pchilik o‘simliklar gul ham hosil qiladi. Gul hosil qiladigan o‘simliklar **gulli o‘simliklar** deb ataladi.","vi":"Em đã biết cây có các bộ phận – cơ quan như rễ, thân và lá. Phần lớn các loài cây còn ra hoa. Những cây ra hoa được gọi là **thực vật có hoa**.","ru":"Вы знаете, что у растений есть части – органы: корень, стебель и лист. Большинство растений образуют ещё и цветки. Растения, образующие цветки, называются **цветковыми растениями**."}],"gallery":[{"src":"img/rose.jpg","caption":{"uz":"Atirgul – gulli o‘simlik","vi":"Hoa hồng – thực vật có hoa","ru":"Роза – цветковое растение"}},{"src":"img/daisy.jpg","caption":{"uz":"Moychechak – gulli o‘simlik. Urug‘lari yordamida ko‘payadi.","vi":"Hoa cúc – thực vật có hoa. Sinh sản bằng hạt.","ru":"Ромашка – цветковое растение. Размножается семенами."}},{"src":"img/fern.jpg","caption":{"uz":"Qirqquloq – sporali o‘simlik. Sporalari yordamida ko‘payadi.","vi":"Dương xỉ – thực vật có bào tử. Sinh sản bằng bào tử.","ru":"Папоротник – споровое растение. Размножается спорами."}},{"src":"img/pine.jpg","caption":{"uz":"Qarag‘ay – ignabargli o‘simlik. Urug‘lari yordamida ko‘payadi.","vi":"Cây thông – thực vật lá kim. Sinh sản bằng hạt.","ru":"Сосна – хвойное растение. Размножается семенами."}}],"note":{"uz":"Sporali va ignabargli o‘simliklar gul hosil qilmaydi.","vi":"Thực vật có bào tử và thực vật lá kim không ra hoa.","ru":"Споровые и хвойные растения не образуют цветков."},"audio_ref":"l11-b3"},{"id":"l11-4","type":"video","rubric":"video","video_ref":"v1"},{"id":"l11-5","type":"text","rubric":"learn","title":{"uz":"Gul qanday qismlardan tuzilgan?","vi":"Hoa gồm những bộ phận nào?","ru":"Из каких частей состоит цветок?"},"paras":[{"uz":"**Gul** – o‘simlikning ko‘payishiga xizmat qiluvchi, ya’ni reproduktiv organ.","vi":"**Hoa** là cơ quan sinh sản của cây, giúp cây sinh sôi.","ru":"**Цветок** – орган, служащий для размножения растения, то есть репродуктивный орган."},{"uz":"Gul gulband, gulo‘rin, gulqo‘rg‘on, changchi va urug‘chidan iborat. Gulband gulni poyaga biriktirib turadi. Gulo‘rinda gulqo‘rg‘on, urug‘chi va changchilar joylashadi.","vi":"Hoa gồm cuống hoa, đế hoa, bao hoa, nhị và nhụy. Cuống hoa gắn hoa vào thân. Trên đế hoa có bao hoa, nhụy và các nhị.","ru":"Цветок состоит из цветоножки, цветоложа, околоцветника, тычинок и пестика. Цветоножка прикрепляет цветок к стеблю. На цветоложе располагаются околоцветник, пестик и тычинки."},{"uz":"**Gulqo‘rg‘on** changchi va urug‘chi yetilgunga qadar ular atrofini o‘rab, himoya qiladi. Aksariyat o‘simliklarda gulqo‘rg‘on **gulkosa** (gulkosachabarglar yig‘indisi) va **gultoj** (gultojibarglar yig‘indisi)dan iborat.","vi":"**Bao hoa** bao quanh và bảo vệ nhị, nhụy cho đến khi chúng chín. Ở phần lớn các loài cây, bao hoa gồm **đài hoa** (tập hợp các lá đài) và **tràng hoa** (tập hợp các cánh hoa).","ru":"**Околоцветник** окружает и защищает тычинки и пестик, пока они не созреют. У большинства растений околоцветник состоит из **чашечки** (совокупности чашелистиков) и **венчика** (совокупности лепестков)."},{"uz":"**Changchi** gulning erkaklik organi bo‘lib, changchi ipi va changdondan tashkil topgan. **Urug‘chi** gulning urg‘ochilik organi bo‘lib, tumshuqcha, ustuncha va tugunchadan iborat.","vi":"**Nhị** là cơ quan đực của hoa, gồm chỉ nhị và bao phấn. **Nhụy** là cơ quan cái của hoa, gồm đầu nhụy, vòi nhụy và bầu nhụy.","ru":"**Тычинка** – мужской орган цветка, она состоит из тычиночной нити и пыльника. **Пестик** – женский орган цветка, он состоит из рыльца, столбика и завязи."},{"uz":"Quyidagi rasm gulning modelidir. Turli o‘simliklarning gullari bir-biridan farq qiladi. Model gulning umumiy tuzilishini tushunib olishingizga yordam beradi.","vi":"Hình dưới đây là mô hình của hoa. Hoa của các loài cây khác nhau thì khác nhau. Mô hình giúp em hiểu cấu tạo chung của hoa.","ru":"На рисунке ниже показана модель цветка. Цветки разных растений отличаются друг от друга. Модель поможет вам понять общее строение цветка."}],"audio_ref":"l11-b5"},{"id":"l11-6","type":"simulation","rubric":"flower","simulation_ref":"flower"},{"id":"l11-7","type":"video","rubric":"video","video_ref":"v2"},{"id":"l11-8","type":"prompt","rubric":"robot","paras":[{"uz":"Qirqquloq va qarag‘ay kabi o‘simliklar qanday ko‘payadi deb o‘ylaysiz?","vi":"Theo em, những cây như dương xỉ và thông sinh sản bằng cách nào?","ru":"Как вы думаете, как размножаются такие растения, как папоротник и сосна?"}],"audio_ref":"l11-b8"},{"id":"l11-9","type":"exercise","rubric":"quiz","title":{"uz":"Bilimingizni sinab ko‘ring!","vi":"Kiểm tra kiến thức!","ru":"Проверьте свои знания!"},"exercise_refs":["l11-9"]},{"id":"l11-10","type":"workbook_link","rubric":"workbook","paras":[{"uz":"Mashq daftari · 1.1-amaliy ish, 1-bet","vi":"Vở bài tập · Bài thực hành 1.1, trang 1","ru":"Рабочая тетрадь · практическая работа 1.1, стр. 1"}],"workbook_ref":"a11"},{"id":"l11-11","type":"list","rubric":"skills","items":[{"uz":"Gulli o‘simliklarga ta’rif beraman va misollar keltira olaman.","vi":"Em nêu được định nghĩa thực vật có hoa và lấy được ví dụ.","ru":"Я могу дать определение цветковым растениям и привести примеры."},{"uz":"Gul qismlarini aniqlay olaman.","vi":"Em xác định được các bộ phận của hoa.","ru":"Я могу определить части цветка."},{"uz":"Gul qismlarining vazifasini tavsiflay olaman.","vi":"Em mô tả được chức năng các bộ phận của hoa.","ru":"Я могу описать функции частей цветка."},{"uz":"Tirik organizmlarni kuzatish natijalariga asoslanib tasniflay olaman.","vi":"Em phân loại được sinh vật dựa trên quan sát.","ru":"Я могу классифицировать живые организмы на основе результатов наблюдений."},{"uz":"Kalit-aniqlagichni to‘ldira olaman.","vi":"Em hoàn thành được khóa phân loại.","ru":"Я могу заполнить определительный ключ."},{"uz":"Modelda obyektning asosiy xususiyatlari aks etishini bayon eta olaman.","vi":"Em giải thích được mô hình thể hiện đặc điểm chính của đối tượng.","ru":"Я могу объяснить, что модель отражает основные свойства объекта."}],"checkable":true}]}],"pages":[{"n":9,"volume":"tb","label":"9","images":{"uz":"pages/p009.jpg"},"pins":[{"kind":"audio","ref":"l11-b0","x":6.85,"y":14.88},{"kind":"audio","ref":"l11-b1","x":35.2,"y":38.14},{"kind":"audio","ref":"l11-b2","x":6.85,"y":51.37},{"kind":"activity","ref":"key11","x":58.66,"y":82.69}]},{"n":10,"volume":"tb","label":"10","images":{"uz":"pages/p010.jpg"},"pins":[{"kind":"audio","ref":"l11-b3","x":70.2,"y":10.04},{"kind":"video","ref":"v1","x":70.28,"y":92.17}]},{"n":1,"volume":"wb","images":{"uz":"wbpages/w001.jpg"},"ink":true,"fields":[{"type":"box","box":[6.86,23.93,4.51,3.4]},{"type":"box","box":[9.19,24.02,1.97,1.49]},{"type":"box","box":[8.11,24.53,2.78,2.03]},{"type":"box","box":[7.89,24.7,2.71,2.05]},{"type":"box","box":[7.68,24.86,2.67,2.11]},{"type":"box","box":[7.01,25.68,1.97,1.49]}]}],"exercises":[{"id":"key11","kind":"ex.sort_bins","lesson":"l11","placement":["lesson","modal"],"bins":[{"uz":"Ha – gulli o‘simliklar","vi":"Có – thực vật có hoa","ru":"Да – цветковые растения"},{"uz":"Yo‘q – gulsiz o‘simliklar","vi":"Không – thực vật không có hoa","ru":"Нет – нецветковые растен азмножается с помощью семян.","audio_ref":"v1-s1"},"min_seconds":7,"visual":{"type":"sim","kind":"sim.scene_custom_draw","params":{"code_ref":"tabiiy5/index.html#V.v1.scenes[1].draw"}}},{"narration":{"uz":"Qirqquloq gul hosil qilmaydi. U sporali o‘simlik. Barglari ostida mayda sporalar yetiladi va shamol ularni tarqatadi.","vi":"Cây dương xỉ không ra hoa. Nó là thực vật có bào tử. Dưới mặt lá có những bào tử nhỏ li ti, gió sẽ mang chúng đi.","ru":"Папоротник не образует цветков. Это споровое растение. На нижней стороне его листьев созревают мелкие споры, и ветер разносит их.","audio_ref":"v1-s2"},"min_seconds":7,"visual":{"type":"sim","kind":"sim.scene_custom_draw","params":{"code_ref":"tabiiy5/index.html#V.v1.scenes[2].draw"}}},{"narration":{"uz":"Qarag‘ay ham gullamaydi. U ignabargli o‘simlik. Qarag‘ayning urug‘lari g‘uddalar ichida yetiladi.","vi":"Cây thông cũng không ra hoa. Nó là cây lá kim. Hạt thông chín bên trong các nón thông.","ru":"Сосна тоже не цветёт. Это хвойное растение. Семена сосны созревают внутри шишек.","audio_ref":"v1-s3"},"min_seconds":7,"visual":{"type":"sim","kind":"sim.scene_custom_draw","params":{"code_ref":"tabiiy5/index.html#V.v1.scenes[3].draw"}}},{"narration":{"uz":"Xulosa: gul hosil qiladigan o‘simliklar gulli o‘simliklar deb ataladi. Sporali va ignabargli o‘simliklar gul hosil qilmaydi.","vi":"Tóm lại: những cây ra hoa được gọi là thực vật có hoa. Thực vật có bào tử và cây lá kim không ra hoa.","ru":"Вывод: растения, образующие цветки, называются цветковыми растениями. Споровые и хвойные растения цветков не образуют.","audio_ref":"v1-s4"},"min_seconds":7,"visual":{"type":"sim","kind":"sim.scene_custom_draw","params":{"code_ref":"tabiiy5/index.html#V.v1.scenes[4].draw"}}}]}],"workbook_sets":[{"id":"a11","no":"1.1","unit":"ch1","kind":{"uz":"amaliy ish","vi":"bài thực hành","ru":"практическая работа"},"title":{"uz":"Gul qismlari","vi":"Các bộ phận của hoa","ru":"Части цветка"},"volume":"wb","page_range":[1,1],"lesson":"l11","skills":{"
