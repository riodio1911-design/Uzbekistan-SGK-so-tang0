<script>/* core.js */
/* T0 core – đầu đọc dùng chung tầng 0 (R1). JS thuần ES2020, không framework.
 *
 * HỢP ĐỒNG (tóm tắt – chi tiết xem HUONG-DAN.md bước ③):
 *  T0.load(book, features)            nạp một cuốn; phát 't0:load'
 *  T0.book, T0.features, T0.lang, T0.setLang(l) (phát 't0:lang' {lang})
 *  T0.t(obj[, lang])                  chuỗi đa ngữ theo lang, dự phòng uz, rồi giá trị đầu tiên
 *  T0.s(key)                          chuỗi giao diện của core (uz/ru/vi)
 *  T0.registerMode(name, {label, available(book,features)->bool, mount(el,ctx)->{unmount()}})
 *  T0.availableModes() -> [name]; T0.setMode(name, opts) (gắn vào T0.root); phát 't0:mode'
 *  T0.registerEx(id, {render(el, item, ctx)->{check()->{ok,score,feedback}, reset(), showSolution?()}})
 *      `item` = CẢ đối tượng bài tập (book.exercises[i]); nếu có item.items[] thì renderer vẽ từng ý.
 *      Renderer KHÔNG vẽ exercise.prompt/no – renderEx vẽ phần đầu, nút Kiểm tra/Làm lại, phản hồi.
 *      check(): ok = true/false, hoặc null nếu không chấm (tự luận); score 0..1; feedback chuỗi tùy chọn;
 *      empty: true = chưa trả lời gì -> core chỉ hiện feedback, không lưu kết quả.
 *  T0.renderEx(el, exercise|id, ctx?) -> controller | null; dạng chưa có renderer: khung "chưa hỗ trợ: ex.xxx".
 *      Ý có kind khác kind của bài (item.kind) được tách và vẽ bằng renderer của kind đó.
 *  T0.registerSim(id, {mount(el, params, ctx)->{unmount()}}), T0.renderSim(el, sim|{kind,params}|id, ctx?)
 *  T0.media.play(clipId, {onSentence?(i,text), onEnd?, text?, rate?, lang?}) -> Promise (xong khi đọc hết)
 *      rate: áp cho cả file audio lẫn giọng trình duyệt (mặc định T0.media.rate). Không có file/clip theo lang:
 *      đọc opts.text, hoặc chữ trỏ bởi clip.text_path, bằng speechSynthesis + nhãn 'giọng trình duyệt'.
 *  ctx truyền vào renderEx/renderSim/mount có thể ghi đè book/lang; ctx.ai_context -> {{context}} của gia sư.
 *  T0.media.speak(text, {lang?, rate?, onSentence?}) -> Promise   (đọc chữ tùy ý bằng giọng trình duyệt)
 *  T0.media.stop(), T0.media.setRate(r), T0.media.rate, T0.media.has(clipId)
 *  T0.store.get(key, def), .set(key, val), .remove(key)  – localStorage, tiền tố 't0:<book_id>:'
 *  T0.ui.modal(contentEl, {title, onClose, wide}) -> {el, body, close()}; T0.ui.toast(msg, ms)
 *  T0.ui.el(tag, attrs, ...children)  tiện ích tạo DOM
 *  T0.tutor.open({role, context})     điền mẫu gia-su/prompts.json (window.T0_PROMPTS) bằng T0.book.profile
 *  T0.asset(path) -> URL tương đối 'mau/<book_id>/<path>' (đổi gốc bằng T0.assetBase)
 *  T0.find(kind, id) – tra exercises/figures/videos/simulations/lessons/pages/glossary
 *  T0.on(evt, fn) / T0.emit(evt, detail) – sự kiện trên document, tên 't0:*'
 */
(function () {
  'use strict';
  const T0 = (window.T0 = window.T0 || {});
  T0.version = '0.9.0';
  T0.LANGS = ['uz', 'ru', 'vi'];
  T0.book = null;
  T0.features = null;
  T0.root = null;
  T0.assetBase = 'mau/{book}/';
  const modes = (T0._modes = T0._modes || {});
  const modeOrder = (T0._modeOrder = T0._modeOrder || []);
  const exReg = (T0._ex = T0._ex || {});
  const simReg = (T0._sim = T0._sim || {});

  /* ---------------- sự kiện ---------------- */
  T0.on = (evt, fn) => { document.addEventListener(evt, fn); return () => document.removeEventListener(evt, fn); };
  T0.emit = (evt, detail) => document.dispatchEvent(new CustomEvent(evt, { detail }));

  /* ---------------- lưu trữ ---------------- */
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* bỏ qua */ } }
  const mem = {};
  function prefix() { return 't0:' + ((T0.book && T0.book.book_id) || '_') + ':'; }

          ans.textContent = T0.t((T0.find && ((window.T0_PROMPTS.personas || []).find((p) => p.id === built.params.persona) || {}).greeting)) || '';
          const inp = el('input', { type: 'text', placeholder: T0.s('tutor_ask'), 'aria-label': T0.s('tutor_ask') });
          const send = el('button', { class: 't0-btn primary', type: 'button' }, T0.s('send'));
          const go = async () => {
            const q = inp.value.trim(); if (!q) return; inp.value = '';
            history.push({ role: 'user', content: q });
            const keep = call.turns_kept || 10;
            const msgs = history.slice(0, 2).concat(history.slice(2).slice(-keep * 2 + 1));
            const t = await ask(msgs);
            if (t) history.push({ role: 'assistant', content: t });
          };
          send.onclick = go; inp.onkeydown = (e) => { if (e.key === 'Enter') go(); };
          box.insertBefore(el('div', { class: 't0-tutor-row' }, inp, send), det);
        } else {
          await ask(built.text);
        }
      });
      return m;
    },
  };

  /* ---------------- tiện ích chấm (dùng chung cho renderer) ---------------- */
  // D2 (18/11/2026): mặc định accept_v2 – MỌI dấu nháy (' ` ʻ ’ ʼ ‘) đổi về ‘ (o' → o‘, g` → g‘), không bỏ.
  // accept_v2_math (tùy chọn qua exercise.grading.rule) = accept_v2 + bước toán của nrm_v1. 'nrm_v1' = bí danh cũ của accept_v2_math.
  const APOS = /[‘’ʻʼ'`]/g;
  function norm(s) { // accept_v2
    return String(s == null ? '' : s).toLowerCase().replace(APOS, '‘').replace(/\s+/g, ' ').trim();
  }
  function normMath(s) { // accept_v2_math
    return norm(s).replace(/,/g, '.').replace(/[*xх·]/g, '×').replace(/[−–—]/g, '-')
      .replace(/\s*([;:<>=×÷+\-/])\s*/g, '$1').replace(/\s+/g, ' ').trim();
  }
  const RULE_ALIAS = { nrm_v1: 'accept_v2_math', nrm_v1_parts: 'accept_v2' };
  function oneEq(v, a, rule) {
    const math = rule === 'accept_v2_math';
    const x = math ? normMath(v) : norm(v), y = math ? normMath(a) : norm(a);
    if (!x) return false;
    if (x === y) return true;
    if (math && /^[\d ]+$/.test(x) && /^[\d ]+$/.test(y) && x.replace(/ /g, '') === y.replace(/ /g, '')) return true;
    const nx = x.replace(',', '.'), ny = y.replace(',', '.');
    if (/^-?\d+(\.\d+)?$/.test(nx) && /^-?\d+(\.\d+)?$/.test(ny)) return Math.abs(parseFloat(nx) - parseFloat(ny)) < 1e-6;
    return false;
  }
  T0.grade = {
    norm, normMath,
    nrm: normMath, // tương thích: tên cũ, nay không bỏ dấu nháy
    DEFAULT_RULE: 'accept_v2',
    rule(r) { r = RULE_ALIAS[r] || r; return r === 'accept_v2_math' ? r : 'accept_v2'; },
    // answer: 'a|b' phương án (hoặc mảng); 'p1;p2' nhiều phần. rule: accept_v2 (mặc định) | accept_v2_math | nrm_v1 (bí danh)
    shortAnswer(value, answer, rule) {
      if (answer == null || answer === '' || (Array.isArray(answer) && !answer.length)) return null;
      const r = T0.grade.rule(rule);
      const alts = Array.isArray(answer) ? answer.map(String) : String(answer).split('|');
      return alts.some((alt) => {
        if (alt.includes(';')) {
          const ps = alt.split(';'), vs = String(value).split(';');
          return ps.length === vs.length && ps.every((p, i) => oneEq(vs[i], p, r));
        }
        return oneEq(value, alt, r);
      });
    },
  };

  /* ---------------- khởi động khung (index.html gọi) ---------------- */
  T0.boot = function (opts) {
    injectCss();
    document.documentElement.lang = T0.lang;
    T0.root = opts.root;
    return T0;
  };
  injectCss.call && document.readyState !== 'loading' ? injectCss() : document.addEventListener('DOMContentLoaded', injectCss);
})();

<script>/* components/blocks.js */
/* components/blocks.js — R2. Hiển thị 13 block.type của schema (text, list, prompt, image, figure, video,
   simulation, exercise, poem, prose, table, procedure, workbook_link).
   Nhãn mục lấy theo rubric của bộ sách qua T0.rubricData (sinh từ tri-thuc/rubric-bo-sach.json).
   API: T0.blocks.render(el, block, ctx) -> {unmount()} ; T0.blocks.rubric(code) -> {label, concept}|null ;
        T0.blocks.u (tiện ích dùng chung: esc, md, tx, asset, h, cropStyle, listenBtn).
   ctx (do modes/lesson.js truyền): {renderExercise(el, exId), openWorkbook(id), dual:boolean} — đều tùy chọn. */
(function () {
  const T0 = window.T0 = window.T0 || {};

  const UI = {
    listen: { uz: 'Tinglash', ru: 'Слушать', vi: 'Nghe' },
    stop: { uz: 'To‘xtatish', ru: 'Стоп', vi: 'Dừng' },
    play: { uz: 'Ko‘rish', ru: 'Смотреть', vi: 'Xem' },
    scenes: { uz: 'sahna', ru: 'сцен', vi: 'cảnh' },
    open: { uz: 'Ochish', ru: 'Открыть', vi: 'Mở' },
    need: { uz: 'Sizga kerak bo‘ladi:', ru: 'Вам понадобится:', vi: 'Em cần chuẩn bị:' },
    steps: { uz: 'Ishni bajarish tartibi:', ru: 'Порядок выполнения:', vi: 'Các bước thực hiện:' },
    missing: { uz: 'Ma’lumot topilmadi', ru: 'Данные не найдены', vi: 'Không tìm thấy dữ liệu' },
    zoom: { uz: 'Kattalashtirish', ru: 'Увеличить', vi: 'Phóng to' }
  };

  /* ---------- tiện ích ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const L = () => T0.lang || 'uz';
  const t = o => (T0.t ? T0.t(o) : (o && (o[L()] || o.uz))) || '';
  /* tx: chuỗi đa ngữ -> HTML (có **đậm**); ctx.dual: hiện thêm dòng bản gốc (lang_base) khi đang xem bản dịch */
  const tx = (o, ctx) => {
    if (o == null) return '';
    if (typeof o === 'string') return md(o);
    let h = md(t(o));
    const base = (T0.book && T0.book.profile && T0.book.profile.lang_base) || 'uz';
    if (ctx && ctx.dual && L() !== base && o[base] && o[L()]) h += `<span class="t0b-orig" lang="${base}">${md(o[base])}</span>`;
    return h;
  };
  const plain = o => t(o).replace(/\*\*/g, '');
  const asset = p => !p ? '' : /^(data:|https?:|blob:|\/)/.test(p) ? p :
    (T0.asset ? T0.asset(p) : 'mau/' + ((T0.book && T0.book.book_id) || '') + '/' + p);
  const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const byId = (arr, id) => (arr || []).find(x => x.id === id);
  /* ảnh trang theo ngôn ngữ in: ưu tiên bản in của lang hiện tại, rồi lang_base, rồi bất kỳ */
  const pageImg = (n, vol) => {
    const b = T0.book || {}; const pg = (b.pages || []).find(p => p.n === n && (!vol || !p.volume || p.volume === vol));
    if (!pg || !pg.images) return '';
    const base = (b.profile && b.profile.lang_base) || 'uz';
    return pg.images[L()] || pg.images[base] || Object.values(pg.images)[0] || '';
  };
  /* page_crop {page, box:[x,y,w,h] %} -> style nền cắt từ ảnh trang */
  const cropStyle = crop => {
    const src = pageImg(crop.page, crop.volume); if (!src) return '';
    const [x, y, w, hh] = crop.box; const ww = w || 100, hgt = hh || ww;
    return `background-image:url('${asset(src)}');background-size:${(100 / ww) * 100}% auto;` +
      `background-position:${ww >= 100 ? 0 : (x / (100 - ww)) * 100}% ${hgt >= 100 ? 0 : (y / (100 - hgt)) * 100}%;aspect-ratio:${ww}/${hgt * 1.319};`;
  };
  const rubric = code => {
    const d = T0.rubricData; if (!d || !code) return null;
    const f = T0.features || {}; const ax2 = (f.axes && f.axes['2']) || {};
    const set = ax2.rubric_set || (T0.book && T0.book.book_id);
    const m = d.books[set] && d.books[set][code];
    return m ? { label: m.label, concept: m.concept, position: (d.concepts[m.concept] || {}).position } : null;
  };

  /* nút nghe theo khối: dùng T0.media.play(clipId) — core tự rơi về giọng trình duyệt nếu không có file */
  let playing = null;
  const listenBtn = (clipId, hostEl) => {
    const b = h('button', 't0b-listen k-hit');
    b.type = 'button';
    const set = on => { b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">${on ? '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>' : '<path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" fill="currentColor"/>'}</svg><span>${esc(t(on ? UI.stop : UI.listen))}</span>`; };
    set(false);
    b.onclick = () => {
      const on = playing && playing.b === b;
      if (playing) { playing.set(false); playing.host && playing.host.classList.remove('t0b-speaking'); playing = null; }
      if (T0.media) T0.media.stop();
      if (on) return;
      playing = { b, set, host: hostEl }; set(true); hostEl && hostEl.classList.add('t0b-speaking');
      const me = playing;
      const done = () => { if (playing === me) { set(false); hostEl && hostEl.classList.remove('t0b-speaking'); playing = null; } };
      /* core: T0.media.play -> Promise xong khi đọc hết (file theo lang, hoặc giọng trình duyệt đọc chữ ở clip.text_path) */
      let pr = null; try { pr = T0.media.play(clipId, {}); } catch (e) { console.warn(e); }
      if (pr && pr.then) pr.then(done, done); else setTimeout(done, 8000);
    };
    return b;
  };

  /* ---------- đầu khối: nhãn rubric + nút nghe ---------- */
  function head(sec, b, ctx, opt) {
    const r = rubric(b.rubric);
    const row = h('div', 't0b-head');
    const lab = (opt && opt.label) || (r && r.label);
    if (lab) row.append(h('div', 't0b-rub', esc(t(lab))));
    else row.append(h('span'));
    if (b.audio_ref) row.append(listenBtn(b.audio_ref, sec));
    if (lab || b.audio_ref) sec.append(row);
    if (r) sec.dataset.concept = r.concept;
  }
  const paras = (arr, ctx, tag) => (arr || []).map(p => `<${tag || 'p'}>${tx(p, ctx)}</${tag || 'p'}>`).join('');

  function exercises(sec, refs, ctx) {
    (refs || []).forEach(id => {
      const host = h('div', 't0b-ex'); sec.append(host);
      if (ctx && ctx.renderExercise) ctx.renderExercise(host, id);
      else {
        const ex = byId(T0.book.exercises, id);
        if (ex && T0.renderEx) T0.renderEx(host, ex, ctx || {}); else host.innerHTML = `<div class="t0b-missing">${esc(t(UI.missing))}: ${esc(id)}</div>`;
      }
    });
  }

  /* ---------- 13 dạng khối ---------- */
  const R = {};
  R.text = (sec, b, ctx) => {
    head(sec, b, ctx);
    if (b.title) sec.append(h('h3', 't0b-title', tx(b.title, ctx)));
    const body = h('div', 't0b-body', paras(b.paras, ctx)); sec.append(body);
    if (b.gallery && b.gallery.length) {
      const g = h('div', 't0b-gallery');
      b.gallery.forEach(it => {
        const f = h('figure', '', `<img src="${esc(asset(it.src))}" alt="${esc(plain(it.caption))}" loading="lazy">${it.caption ? `<figcaption>${tx(it.caption, ctx)}</figcaption>` : ''}`);
        f.querySelector('img').onerror = function () { this.replaceWith(h('div', 't0b-noimg', esc(it.src))); };
        g.append(f);
      });
      sec.append(g);
    }
    if (b.note) sec.append(h('p', 't0b-note', tx(b.note, ctx)));
    exercises(sec, b.exercise_refs, ctx);
  };
  R.list = (sec, b, ctx) => {
    head(sec, b, ctx);
    if (b.title) sec.append(h('h3', 't0b-title', tx(b.title, ctx)));
    if (b.checkable) {
      const box = h('div', 't0b-checks');
      (b.items || []).forEach((it, i) => {
        const key = 'check:' + (b.id || 'b') + ':' + i;
        const lab = h('label', 't0b-check k-hit', `<input type="checkbox"><span>${tx(it, ctx)}</span>`);
        const inp = lab.querySelector('input'); inp.checked = !!(T0.store && T0.store.get(key, false));
        inp.onchange = () => T0.store && T0.store.set(key, inp.checked);
        box.append(lab);
      });
      sec.append(box);
    } else sec.append(h('ul', 't0b-list', paras(b.items, ctx, 'li')));
  };
  R.prompt = (sec, b, ctx) => {
    const r = rubric(b.rubric);
    const companion = r && r.concept === 'companion_character';
    sec.classList.add(companion ? 't0b-companion' : 't0b-think');
    const ic = h('div', 't0b-ic', companion
      ? '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="12" width="28" height="24" rx="8" fill="currentColor"/><circle cx="19" cy="24" r="3.5" fill="var(--color-surface)"/><circle cx="29" cy="24" r="3.5" fill="var(--color-surface)"/><rect x="22" y="4" width="4" height="8" rx="2" fill="currentColor"/><rect x="16" y="38" width="16" height="6" rx="3" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M19 37h10M20 42h8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M24 12v9l5 3" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>');
    const wrap = h('div', 't0b-bubble');
    sec.append(ic, wrap);
    head(wrap, b, ctx);
    if (b.title) wrap.append(h('h3', 't0b-title', tx(b.title, ctx)));
    wrap.append(h('div', 't0b-body', paras(b.paras, ctx)));
    exercises(wrap, b.exercise_refs, ctx);
  };
  R.image = (sec, b, ctx) => {
    head(sec, b, ctx);
    const f = h('figure', 't0b-figure');
    if (b.src) f.innerHTML = `<img src="${esc(asset(b.src))}" alt="${esc(plain(b.caption))}" loading="lazy">`;
    else if (b.crop) { const st = cropStyle(b.crop); f.innerHTML = st ? `<div class="t0b-crop" role="img" aria-label="${esc(plain(b.caption))}" style="${st}"></div>` : `<div class="t0b-noimg">p.${b.crop.page}</div>`; }
    if (b.caption) f.append(h('figcaption', '', tx(b.caption, ctx)));
    sec.append(f);
  };
  R.figure = (sec, b, ctx) => {
    head(sec, b, ctx);
    const fig = byId(T0.book.figures, b.figure_ref);
    const host = h('div', 't0b-simhost'); sec.append(host);
    if (!fig) { host.innerHTML = `<div class="t0b-missing">${esc(t(UI.missing))}: ${esc(b.figure_ref)}</div>`; return; }
    /* figures dùng chung renderer sim.figure_explorer của R1; params = chính bản ghi figure */
    return T0.renderSim(host, { id: fig.id, kind: 'sim.figure_explorer', params: fig }, ctx);
  };
  R.video = (sec, b, ctx) => {
    head(sec, b, ctx);
    const v = byId(T0.book.videos, b.video_ref);
    if (!v) { sec.append(h('div', 't0b-missing', esc(t(UI.missing)) + ': ' + esc(b.video_ref))); return; }
    const card = h('button', 't0b-vcard k-hit');
    card.type = 'button';
    card.innerHTML = `<span class="t0b-vplay" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
      <span class="t0b-vtxt"><b>${tx(v.title, ctx)}</b><small>${(v.scenes || []).length} ${esc(t(UI.scenes))}</small></span>`;
    sec.append(card);
    let inst = null;
    card.onclick = () => {
      const host = h('div', 't0b-simhost'); card.replaceWith(host);
      inst = T0.renderSim(host, { id: v.id, kind: 'sim.scene_player', params: { video: v, autoplay: true } }, ctx);
    };
    return { unmount() { inst && inst.unmount && inst.unmount(); } };
  };
  R.simulation = (sec, b, ctx) => {
    const sim = byId(T0.book.simulations, b.simulation_ref);
    head(sec, b, ctx, sim && sim.title ? { label: sim.title } : null);
    const host = h('div', 't0b-simhost'); sec.append(host);
    if (!sim) { host.innerHTML = `<div class="t0b-missing">${esc(t(UI.missing))}: ${esc(b.simulation_ref)}</div>`; return; }
    /* sim.figure_explorer dạng "parts" (tabiiy5 mountFlower: SVG vẽ bằng mã, tọa độ theo viewbox) do renderer của R1 vẽ.
       Hình nền vẽ bằng mã đã xuất thành tệp: quy ước params.background_src mặc định 'sim/<id>.svg' (đề xuất D2). */
    if (sim.kind === 'sim.figure_explorer' && sim.params && Array.isArray(sim.params.parts) && !sim.params.background_src)
      return T0.renderSim(host, Object.assign({}, sim, { params: Object.assign({ background_src: 'sim/' + sim.id + '.svg' }, sim.params) }), ctx);
    return T0.renderSim(host, sim, ctx);
  };
  R.exercise = (sec, b, ctx) => {
    head(sec, b, ctx);
    if (b.title) sec.append(h('h3', 't0b-title', tx(b.title, ctx)));
    if (b.paras) sec.append(h('div', 't0b-body', paras(b.paras, ctx)));
    exercises(sec, b.exercise_refs, ctx);
  };
  R.poem = (sec, b, ctx) => {
    head(sec, b, ctx);
    if (b.title && !b.untitled) sec.append(h('h3', 't0b-title', tx(b.title, ctx)));
    if (b.by) sec.append(h('div', 't0b-by', tx(b.by, ctx)));
    const p = h('div', 't0b-poem');
    (b.stanzas || []).forEach(st => p.append(h('p', 't0b-stanza', st.map(l => `<span>${tx(l, ctx)}</span>`).join(''))));
    sec.append(p);
  };
  R.prose = (sec, b, ctx) => {
    head(sec, b, ctx);
    if (b.title && !b.untitled) sec.append(h('h3', 't0b-title', tx(b.title, ctx)));
    if (b.by) sec.append(h('div', 't0b-by', tx(b.by, ctx)));
    sec.append(h('div', 't0b-prose', paras(b.paras, ctx)));
  };
  R.table = (sec, b, ctx) => {
    head(sec, b, ctx);
    if (b.title) sec.append(h('h3', 't0b-title', tx(b.title, ctx)));
    const tb = b.table || {}; const cols = tb.cols || [];
    const rows = Array.isArray(tb.rows) ? tb.rows : Array.from({ length: tb.rows || 0 }, () => cols.map(() => null));
    const first = tb.first_col;
    const w = h('div', 't0b-tablewrap');
    w.innerHTML = `<table class="t0b-table">${cols.length ? `<thead><tr>${cols.map(c => `<th>${tx(c, ctx)}</th>`).join('')}</tr></thead>` : ''}<tbody>${rows.map((r, i) => `<tr>${first ? `<th scope="row">${tx(first[i], ctx)}</th>` : ''}${(first ? r.slice(1) : r).map(c => `<td>${c ? tx(c, ctx) : ''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    sec.append(w);
  };
  R.procedure = (sec, b, ctx) => {
    head(sec, b, ctx);
    if (b.title) sec.append(h('h3', 't0b-title', tx(b.title, ctx)));
    if (b.paras) sec.append(h('div', 't0b-body', paras(b.paras, ctx)));
    if (b.need) sec.append(h('div', 't0b-need', `<b>${esc(t(UI.need))}</b><p>${tx(b.need, ctx)}</p>`));
    if (b.steps) sec.append(h('div', 't0b-steps', `<b>${esc(t(UI.steps))}</b><ol>${paras(b.steps, ctx, 'li')}</ol>`));
    exercises(sec, b.exercise_refs, ctx);
  };
  R.workbook_link = (sec, b, ctx) => {
    head(sec, b, ctx);
    const btn = h('button', 't0b-wblink k-hit', `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 3h11l3 3v15H5z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2"/></svg><span>${paras(b.paras, ctx, 'span')}</span><span aria-hidden="true">→</span>`);
    btn.type = 'button';
    if (ctx && ctx.openWorkbook && b.workbook_ref) btn.onclick = () => ctx.openWorkbook(b.workbook_ref);
    else btn.disabled = true;
    sec.append(btn);
  };

  function render(el, b, ctx) {
    const sec = h('section', 't0b t0b-' + b.type);
    if (b.id) sec.dataset.block = b.id;
    if (b.rubric) sec.dataset.rubric = b.rubric;
    el.append(sec);
    const fn = R[b.type];
    let inst = null;
    if (!fn) sec.innerHTML = `<div class="t0-unsupported">block.type: ${esc(b.type)}</div>`;
    else { try { inst = fn(sec, b, ctx || {}); } catch (e) { console.error('[blocks]', b.id, e); sec.append(h('div', 't0b-missing', 'error: ' + esc(b.type))); } }

<script>/* components/ex/choice_single.js */
/* ex.choice_single – trắc nghiệm một đáp án (R1). Quy tắc chấm: index_match (thư viện bài tập).
 * Dữ liệu: exercise.items[] = {prompt, options[], correct} hoặc chính exercise có options/correct.
 * Chọn đổi được tới khi bấm Kiểm tra; Kiểm tra thì khóa, tô đúng/sai. Điểm = số câu đúng / số câu. */
(function () {
  const T0 = window.T0;
  const CSS = `
.ex-cs-q{margin:0 0 var(--space-4,16px)}
.ex-cs-q:last-child{margin-bottom:0}

.ex-cs-p b{color:var(--color-ink-2);margin-right:4px}
.ex-cs-sub{display:block;color:var(--color-ink-2);font-size:var(--text-sm,13px)}

.ex-cs-o{display:flex;align-items:center;gap:var(--space-2,8px);text-align:left;min-height:var(--touch-min,44px);padding:var(--space-2,8px) var(--space-3,12px);border:1.5px solid var(--color-line);border-radius:var(--radius-md,10px);background:var(--color-surface);color:var(--color-ink);font:inherit;font-size:var(--text-ui,15px);cursor:pointer}
.ex-cs-o .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--color-line);display:inline-flex;align-items:center;justify-content:center;font-size:var(--text-xs,12px);font-weight:700;color:var(--color-ink-2)}
.ex-cs-o[aria-checked="true"]{border-color:var(--color-accent);background:var(--color-accent-soft)}
.ex-cs-o[aria-checked="true"] .k{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-on-accent)}
.ex-cs-o.ok{border-color:var(--color-ok);background:var(--color-ok-soft)}
.ex-cs-o.bad{border-color:var(--color-bad);background:var(--color-bad-soft)}

.ex-cs-o:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}`;
  function css() { if (!document.getElementById('ex-cs-css')) document.head.append(Object.assign(document.createElement('style'), { id: 'ex-cs-css', textContent: CSS })); }

  T0.registerEx('ex.choice_single', {
    render(el, ex, ctx) {
      css();
      const E = T0.ui.el;
      const qs = Array.isArray(ex.items) && ex.items.length ? ex.items : [ex];
      const state = qs.map(() => -1);
      const rows = [];
      let locked = false;
      qs.forEach((q, qi) => {
        const box = E('div', { class: 'ex-cs-q', role: 'radiogroup' });
        const pid = 'cs' + Math.random().toString(36).slice(2, 8);
        if (q !== ex && q.prompt) {
          const p = E('p', { class: 'ex-cs-p', id: pid }, qs.length > 1 ? E('b', { text: (qi + 1) + '.' }) : null, T0.t(q.prompt));
          box.append(p); box.setAttribute('aria-labelledby', pid);
        }
        const opts = E('div', { class: 'ex-cs-opts' });
        const btns = (q.options || []).map((o, oi) => {
          const b = E('button', { type: 'button', class: 'ex-cs-o', role: 'radio', 'aria-checked': 'false' },
            E('span', { class: 'k', text: 'ABCDEFGH'[oi] }), E('span', { text: T0.t(o) }));
          b.onclick = () => {
            if (locked) return;
            state[qi] = oi;
            btns.forEach((x, i) => x.setAttribute('aria-checked', String(i === oi)));
          };
          opts.append(b);
          return b;
        });
        box.append(opts);
        el.append(box);
        rows.push({ q, btns });
      });
      const correctOf = (q) => (Array.isArray(q.correct) ? q.correct[0] : q.correct);
      return {
        check() {
          locked = true;
          let right = 0;
          rows.forEach(({ q, btns }, qi) => {
            const c = correctOf(q);
            btns.forEach((b, i) => {
              b.disabled = true;
              b.classList.toggle('ok', i === c && state[qi] === c);
              b.classList.toggle('bad', i === state[qi] && i !== c);
            });
            if (state[qi] === c) right++;
          });
          const score = right / rows.length;
          return { ok: right === rows.length, score, feedback: rows.length > 1 ? `${T0.s('score')}: ${right}/${rows.length}` : '' };
        },
        reset() {
          locked = false;
          state.fill(-1);
          rows.forEach(({ btns }) => btns.forEach((b) => { b.disabled = false; b.classList.remove('ok', 'bad'); b.setAttribute('aria-checked', 'false'); }));
        },
        showSolution() {
          rows.forEach(({ q, btns }) => { const c = correctOf(q); if (btns[c]) btns[c].classList.add('ok'); });
        },
        // cho người kiểm thử / gia sư
        _answer: (qi, oi) => rows[qi] && rows[qi].btns[oi] && rows[qi].btns[oi].click(),
      };
    },
  });
})();

</script>
<script>/* components/ex/open_response.js */
/* ex.open_response – trả lời mở / tự luận (R1). Chấm: none_with_model_answer (lưu, sau khi lưu hiện lời giải mẫu),
 * keyword_regex nếu ý có answer_pattern. Nhận xét AI: nút "Gợi ý" của khung renderEx (ai_feedback.role).
 * Dữ liệu: exercise.items[] = {label?, prompt?, open, solution?, answer_pattern?} hoặc chính exercise. */
(function () {
  const T0 = window.T0;
  const CSS = `
.ex-or-row{margin-bottom:var(--space-3,12px)}
.ex-or-row:last-child{margin-bottom:0}
.ex-or-p{margin:0 0 var(--space-2,8px);font-size:var(--text-ui,15px)}
.ex-or-ta{display:block;width:100%;min-height:110px;resize:vertical;border:1.5px solid var(--color-line);border-radius:var(--radius-md,10px);padding:var(--space-2,8px) var(--space-3,12px);font:inherit;font-size:var(--text-body,16px);line-height:var(--lh-body,1.5);background:var(--color-surface);color:var(--color-ink);background-image:repeating-linear-gradient(transparent,transparent calc(1.5em - 1px),var(--color-line) calc(1.5em - 1px),var(--color-line) 1.5em);background-attachment:local;background-position:0 var(--space-2,8px)}
.ex-or-ta:focus-visible{outline:3px solid var(--color-accent);outline-offset:1px}
.ex-or-row .t0-solution{margin-top:var(--space-2,8px)}
.ex-or-row .t0-solution b{display:block;font-size:var(--text-xs,12px);color:var(--color-ink-2);text-transform:uppercase;letter-spacing:.04em}`;
  function css() { if (!document.getElementById('ex-or-css')) document.head.append(Object.assign(document.createElement('style'), { id: 'ex-or-css', textContent: CSS })); }
  const EMPTY = { uz: 'Avval javobingizni yozing.', ru: 'Сначала напиши свой ответ.', vi: 'Em hãy viết câu trả lời trước đã.' };
  const MODEL = { uz: 'Namuna javob', ru: 'Образец ответа', vi: 'Lời giải mẫu' };

  T0.registerEx('ex.open_response', {
    render(el, ex, ctx) {
      css();
      const E = T0.ui.el;
      const items = Array.isArray(ex.items) && ex.items.length ? ex.items : [ex];
      const key = (ctx.storeKey || 'ex:' + ex.id) + ':v';
      const saved = (ctx.store && ctx.store.get(key)) || {};
      const rows = items.map((it, i) => {
        const row = E('div', { class: 'ex-or-row' });
        const id = 'or' + Math.random().toString(36).slice(2, 8);
        if (it !== ex && (it.prompt || it.label)) row.append(E('label', { class: 'ex-or-p', for: id, text: [it.label, T0.t(it.prompt)].filter(Boolean).join('. ') }));
        const ta = E('textarea', { class: 'ex-or-ta', id, rows: '4', 'aria-label': T0.t(ex.prompt) || T0.s('exercise') });
        ta.value = saved[i] || '';
        row.append(ta);
        el.append(row);
        return { it, ta, row, sol: null };
      });
      const graded = rows.some((r) => r.it.answer_pattern);
      const showSol = () => rows.forEach((r) => {
        if (r.sol || !r.it.solution) return;
        r.sol = E('div', { class: 't0-solution' }, E('b', { text: T0.t(MODEL) }), T0.t(r.it.solution));
        r.row.append(r.sol);
      });
      return {
        noCheck: !graded,
        check() {
          if (!rows.some((r) => r.ta.value.trim())) {
            const first = rows[0] && rows[0].ta; if (first) first.focus();
            return { ok: null, score: null, empty: true, feedback: T0.t(EMPTY) };
          }
          const vals = {};
          rows.forEach((r, i) => { vals[i] = r.ta.value; });
          if (ctx.store) ctx.store.set(key, vals);
          const filled = rows.filter((r) => r.ta.value.trim()).length;
          if (filled) showSol();
          if (!graded) return { ok: null, score: null, feedback: filled ? T0.s('saved') : '' };
          const g = rows.filter((r) => r.it.answer_pattern);
          const right = g.filter((r) => { try { return new RegExp(r.it.answer_pattern, 'i').test(r.ta.value); } catch (e) { return false; } }).length;
          return { ok: right === g.length, score: right / g.length };
        },
        reset() {
          rows.forEach((r) => { r.ta.value = ''; if (r.sol) { r.sol.remove(); r.sol = null; } });
          if (ctx.store) ctx.store.remove(key);
        },
        showSolution: showSol,
      };
    },
  });
})();

</script>

  T0.registerEx('ex.short_answer', {
    render(el, ex, ctx) {

    drop: { uz: 'Shu yerga qo‘yish', ru: 'Положить сюда', vi: 'Đặt vào đây' },
    allRight: { uz: 'Barakalla! Hammasi to‘g‘ri.', ru: 'Молодец! Всё верно.', vi: 'Giỏi lắm! Tất cả đều đúng.' },
    someWrong: { uz: 'Qizil bilan belgilanganlarni qayta ko‘rib chiqing.', ru: 'Проверьте карточки, отмеченные красным.', vi: 'Hãy xem lại các thẻ viền đỏ.' },
    notAll: { uz: 'Hamma kartalarni joylashtiring.', ru: 'Разложите все карточки.', vi: 'Hãy xếp hết các thẻ.' }
  };
  const t = o => (T0.t ? T0.t(o) : (o && (o[T0.lang] || o.uz))) || '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const asset = p => !p ? '' : /^(data:|https?:|blob:|\/)/.test(p) ? p : (T0.asset ? T0.asset(p) : 'mau/' + T0.book.book_id + '/' + p);

  function render(el, ex, ctx) {
    const bins = (ex.bins || []).map((b, i) => ({ key: (b && b.key) || i, name: b && b.name ? b.name : b }));
    const imgs = ex.data && ex.data.card_images ? Object.values(ex.data.card_images) : [];
    const cards = (ex.cards || []).map((c, i) => ({
      i, text: c.text, image: c.image || imgs[i] || null,
      bin: typeof c.bin === 'number' ? c.bin : Math.max(0, bins.findIndex(b => b.key === c.bin))
    }));
    const skey = 'ex:' + ex.id + ':ans';
    let place = Object.assign({}, (T0.store && T0.store.get(skey, null)) || {});
    let pick = null, checked = false;
    const save = () => T0.store && T0.store.set(skey, place);

    const cardH = c => {
      const st = checked && place[c.i] != null ? (place[c.i] === c.bin ? ' ok' : ' bad') : '';
      return `<button type="button" class="t0x-card k-hit${st}" data-c="${c.i}" aria-pressed="${pick === c.i}">${c.image ? `<img src="${esc(asset(c.image))}" alt="" loading="lazy">` : ''}<span>${esc(t(c.text))}</span></button>`;
    };
    const draw = () => {
      const free = cards.filter(c => place[c.i] == null);
      el.innerHTML = `<div class="t0x-sort">
        <p class="t0x-hint">${esc(t(UI.pick))}</p>
        <div class="t0x-pool" aria-label="${esc(t(UI.left))}">${free.map(cardH).join('')}</div>
        <div class="t0x-bins">${bins.map((b, bi) => `<div class="t0x-bin${pick != null ? ' armed' : ''}" data-b="${bi}">
          <button type="button" class="t0x-binhead k-hit" data-b="${bi}">${esc(t(b.name))}${pick != null ? `<small>${esc(t(UI.drop))}</small>` : ''}</button>
          <div class="t0x-bincards">${cards.filter(c => place[c.i] === bi).map(cardH).join('')}</div></div>`).join('')}</div></div>`;
      el.querySelectorAll('[data-c]').forEach(b => b.onclick = e => {
        e.stopPropagation(); const k = +b.dataset.c;
        if (place[k] != null) { delete place[k]; checked = false; pick = k; save(); }
        else pick = pick === k ? null : k;
        draw();
      });
      el.querySelectorAll('button[data-b]').forEach(b => b.onclick = () => {
        if (pick == null) return; place[pick] = +b.dataset.b; pick = null; checked = false; save(); draw();
      });
    };
    draw();
    return {
      check() {
        checked = true; draw();
        const right = cards.filter(c => place[c.i] === c.bin).length, n = cards.length;
        const all = cards.every(c => place[c.i] != null);
        const ok = right === n;
        return { ok, score: n ? right / n : 0, feedback: ok ? t(UI.allRight) : (!all ? t(UI.notAll) + ' ' : '') + (right < cards.filter(c => place[c.i] != null).length ? t(UI.someWrong) : '') + ` (${right}/${n})` };
      },
      reset() { place = {}; pick = null; checked = false; save(); draw(); },
      answer() { return Object.assign({}, place); }
    };
  }

  const css = `
.t0x-q{margin:0 0 6px;font-weight:700}.t0x-hint{margin:0 0 var(--space-2);color:var(--color-ink-2);font-size:var(--text-sm)}
.t0x-pool{display:flex;flex-wrap:wrap;gap:var(--space-2);min-height:var(--touch-min);margin-bottom:var(--space-3)}
.t0x-card{display:inline-flex;align-items:center;gap:8px;min-height:var(--touch-min);padding:4px 12px 4px 4px;border-radius:var(--radius-sm);border:2px solid var(--color-line);background:var(--color-surface);color:var(--color-ink);font:inherit;font-weight:700;cursor:pointer}
.t0x-card:not(:has(img)){padding-left:12px}
.t0x-card img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.t0x-card[aria-pressed=true]{border-color:var(--hue-orange);box-shadow:0 0 0 3px var(--hue-orange-soft)}
.t0x-card.ok{border-color:var(--color-ok);background:var(--color-ok-soft)}.t0x-card.bad{border-color:var(--color-bad);background:var(--color-bad-soft)}
.t0x-bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3)}
.t0x-bin{border:2px dashed var(--color-line);border-radius:var(--radius-md);padding:var(--space-2);background:var(--color-surface-2);min-height:110px}
.t0x-bin.armed{border-color:var(--color-accent)}
.t0x-binhead{display:block;width:100%;min-height:var(--touch-min);border:0;border-radius:var(--radius-sm);background:var(--color-accent-soft);color:var(--color-accent-ink);font:inherit;font-weight:800;padding:6px 8px;cursor:pointer;text-align:center}
.t0x-binhead small{display:block;font-weight:600;font-size:var(--text-xs)}
.t0x-bincards{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--space-2)}
`;
  if (!document.getElementById('t0x-sort-css')) { const s = document.createElement('style'); s.id = 't0x-sort-css'; s.textContent = css; document.head.append(s); }
  T0.registerEx('ex.sort_bins', { render });
})();

</script>
<script>/* components/ex/table_fill.js */
/* components/ex/table_fill.js — R2. Dạng ex.table_fill (thu-vien/bai-tap/danh-muc.json).
   Hai dạng dữ liệu đang có:
   (A) "hàng có chọn" (tabiiy5 WB table): items[{prompt, correct}] = hàng (cột đầu cố định) + ô chọn chức năng;
       phương án lấy từ data.cell_options | exercise.options | item.options; cột ghi chú tự do từ data.flowers.
       Chấm select_per_row: đúng nếu chỉ số chọn === correct; điểm = số hàng đúng / số hàng.
       Không có danh sách phương án → ô chữ tự do, chỉ lưu (không chấm) và báo thiếu dữ liệu.
   (B) "bảng trống" (biologiya5/adabiyot5): table{cols, rows:số|mảng, first_col}; ô {input/answer?} chấm accept_v2, còn lại chỉ lưu.
   Phần đầu (prompt) và nút Kiểm tra/Lưu do T0.renderEx (core) vẽ; noCheck=true khi không có ô chấm được.
   Đáp án lưu: T0.store 'ex:<id>:ans'. */
(function () {
  const T0 = window.T0 = window.T0 || {};
  const UI = {
    part: { uz: 'Qism', ru: 'Часть', vi: 'Bộ phận' },
    fn: { uz: 'Vazifasi', ru: 'Функция', vi: 'Chức năng' },
    choose: { uz: '— tanlang —', ru: '— выберите —', vi: '— chọn —' },
    note: { uz: 'rangi, soni…', ru: 'цвет, количество…', vi: 'màu, số lượng…' },
    noOpts: { uz: 'Variantlar ro‘yxati yo‘q — javob faqat saqlanadi.', ru: 'Нет списка вариантов — ответ только сохраняется.', vi: 'Dữ liệu chưa có danh sách phương án — câu trả lời chỉ được lưu, không chấm.' },
    saved: { uz: 'Saqlandi.', ru: 'Сохранено.', vi: 'Đã lưu.' },
    allRight: { uz: 'Barakalla! Hammasi to‘g‘ri.', ru: 'Молодец! Всё верно.', vi: 'Giỏi lắm! Tất cả đều đúng.' },
    someWrong: { uz: 'Qizil kataklarni qayta ko‘rib chiqing.', ru: 'Проверьте ячейки, отмеченные красным.', vi: 'Hãy xem lại các ô viền đỏ.' }
  };
  const t = o => (T0.t ? T0.t(o) : (o && (o[T0.lang] || o.uz))) || '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const asset = p => !p ? '' : /^(data:|https?:|blob:|\/)/.test(p) ? p : (T0.asset ? T0.asset(p) : 'mau/' + T0.book.book_id + '/' + p);
  /* accept_v2 (D2): chữ thường, MỌI dấu nháy → ‘, gộp khoảng trắng, bỏ dấu chấm cuối; phương án thay thế nối bằng '|' */
  const norm = s => (T0.grade && T0.grade.norm ? T0.grade.norm(s) : String(s || '').toLowerCase().replace(/[‘’ʻʼ'`]/g, '‘').replace(/\s+/g, ' ').trim()).replace(/[.。]+$/, '').trim();
  const accept = (v, ans) => String(ans).split('|').some(a => norm(a) === norm(v));

  function render(el, ex, ctx) {
    const skey = 'ex:' + ex.id + ':ans';
    let ans = Object.assign({}, (T0.store && T0.store.get(skey, null)) || {});
    let checked = false;
    const save = () => T0.store && T0.store.set(skey, ans);
    const data = ex.data || {};
    const rowsMode = Array.isArray(ex.items) && ex.items.length && !ex.table;

    if (rowsMode) {
      const items = ex.items;
      const optsFor = it => ex.cell_options || data.cell_options || ex.options || it.options || null; // ex.cell_options: chuẩn D2
      const extra = data.flowers || data.columns_extra || [];
      const anyOpts = items.some(optsFor);
      const draw = () => {
        el.innerHTML = `<div class="t0x-tf">
          ${!anyOpts ? `<p class="t0x-warn">${esc(t(UI.noOpts))}</p>` : ''}
          ${extra.length ? `<div class="t0x-tf-heads">${extra.map(f => `<figure>${f.src ? `<img src="${esc(asset(f.src))}" alt="">` : ''}<figcaption>${esc(t(f.name))}</figcaption></figure>`).join('')}</div>` : ''}
          <div class="t0x-tf-rows">${items.map((it, i) => {
            const opts = optsFor(it); const v = ans['f' + i];
            const st = checked && opts ? (v !== undefined && v !== '' && +v === it.correct ? ' ok' : ' bad') : '';
            return `<div class="t0x-tf-row"><div class="t0x-tf-part">${esc(t(it.prompt))}</div>
              <label class="t0x-tf-cell"><span>${esc(t(UI.fn))}</span>${opts
                ? `<select class="k-hit${st}" data-f="${i}"><option value="">${esc(t(UI.choose))}</option>${opts.map((o, j) => `<option value="${j}"${v !== undefined && v !== '' && +v === j ? ' selected' : ''}>${esc(t(o))}</option>`).join('')}</select>`
                : `<input type="text" data-ft="${i}" value="${esc(ans['t' + i] || '')}">`}</label>
              ${extra.map((f, k) => `<label class="t0x-tf-cell"><span>${esc(t(f.name))}</span><input type="text" data-n="${i}-${k}" value="${esc(ans['n' + i + '-' + k] || '')}" placeholder="${esc(t(UI.note))}"></label>`).join('')}
            </div>`;
          }).join('')}</div></div>`;
        el.querySelectorAll('select[data-f]').forEach(s => s.onchange = () => { ans['f' + s.dataset.f] = s.value; checked = false; s.classList.remove('ok', 'bad'); save(); });
        el.querySelectorAll('input[data-ft]').forEach(s => s.onchange = () => { ans['t' + s.dataset.ft] = s.value; save(); });
        el.querySelectorAll('input[data-n]').forEach(s => s.onchange = () => { ans['n' + s.dataset.n] = s.value; save(); });
      };
      draw();
      return {
        check() {
          if (!anyOpts) return { ok: null, score: null, feedback: t(UI.saved) };
          checked = true; draw();
          const g = items.filter(optsFor); const right = g.filter(it => { const i = items.indexOf(it); const v = ans['f' + i]; return v !== undefined && v !== '' && +v === it.correct; }).length;
          const ok = right === g.length;
          return { ok, score: g.length ? right / g.length : 0, feedback: (ok ? t(UI.allRight) : t(UI.someWrong)) + ` (${right}/${g.length})` };
        },
        reset() { ans = {}; checked = false; save(); draw(); },
        answer() { return Object.assign({}, ans); },
        noCheck: !anyOpts
      };
    }

    /* (B) bảng trống */
    const tb = ex.table || {}; const cols = tb.cols || []; const first = tb.first_col || null;
    const nrows = Array.isArray(tb.rows) ? tb.rows.length : (tb.rows || (first ? first.length : 3));
    const fixed = Array.isArray(tb.rows) ? tb.rows : null;
    const ncols = Math.max(cols.length - (first ? 1 : 0), 1);
    const cellOf = (r, c) => fixed && fixed[r] ? fixed[r][c + (first ? 1 : 0)] : null;
    const graded = [];
    const draw = () => {
      el.innerHTML = `<div class="t0x-tf"><div class="t0x-tf-scroll"><table class="t0x-tbl">
        ${cols.length ? `<thead><tr>${cols.map(c => `<th>${esc(t(c))}</th>`).join('')}</tr></thead>` : ''}
        <tbody>${Array.from({ length: nrows }, (_, r) => `<tr>${first ? `<th scope="row">${esc(t(first[r]))}</th>` : ''}${Array.from({ length: ncols }, (_, c) => {
          const cell = cellOf(r, c); const k = 'r' + r + 'c' + c;
          if (cell && !cell.input && (cell.uz || typeof cell === 'string')) return `<td>${esc(t(cell))}</td>`;
          const st = checked && cell && cell.answer ? (accept(ans[k], cell.answer) ? ' ok' : ' bad') : '';
          return `<td><input type="text" class="${st}" data-k="${k}" value="${esc(ans[k] || '')}" placeholder="${esc(cell && cell.placeholder ? t(cell.placeholder) : '')}"></td>`;
        }).join('')}</tr>`).join('')}</tbody></table></div></div>`;
      el.querySelectorAll('input[data-k]').forEach(s => s.onchange = () => { ans[s.dataset.k] = s.value; save(); });
    };
    draw();
    if (fixed) fixed.forEach((row, r) => row.forEach((cell, c) => { if (cell && cell.answer) graded.push(['r' + r + 'c' + (c - (first ? 1 : 0)), cell.answer]); }));
    return {
      check() {
        if (!graded.length) return { ok: null, score: null, feedback: t(UI.saved) };
        checked = true; draw();
        const right = graded.filter(([k, a]) => accept(ans[k], a)).length;
        return { ok: right === graded.length, score: right / graded.length, feedback: (right === graded.length ? t(UI.allRight) : t(UI.someWrong)) + ` (${right}/${graded.length})` };
      },
      reset() { ans = {}; checked = false; save(); draw(); },
      answer() { return Object.assign({}, ans); },
      noCheck: !graded.length
    };
  }

  const css = `
.t0x-warn{margin:0 0 var(--space-2);padding:6px 10px;border-radius:var(--radius-sm);background:var(--hue-gold-soft);color:var(--color-ink);font-size:var(--text-sm)}
.t0x-tf-heads{display:flex;gap:var(--space-3);margin:0 0 var(--space-3)}
.t0x-tf-heads figure{margin:0;display:flex;align-items:center;gap:8px;font-size:var(--text-sm);font-weight:700}
.t0x-tf-heads img{width:52px;height:52px;object-fit:cover;border-radius:var(--radius-sm)}
.t0x-tf-rows{display:grid;gap:var(--space-2)}
.t0x-tf-row{display:grid;gap:var(--space-2);grid-template-columns:1fr;padding:var(--space-3);border:1px solid var(--color-line);border-radius:var(--radius-sm);background:var(--color-surface-2)}
@media (min-width:700px){.t0x-tf-row{grid-template-columns:minmax(120px,.8fr) minmax(180px,1.6fr) repeat(auto-fit,minmax(120px,1fr));align-items:end}}
.t0x-tf-part{font-weight:800;align-self:center}
.t0x-tf-cell{display:flex;flex-direction:column;gap:2px;font-size:var(--text-xs);color:var(--color-ink-2);min-width:0}
.t0x-tf-cell select,.t0x-tf-cell input,.t0x-tbl input{min-height:var(--touch-min);font:inherit;font-size:var(--text-ui);color:var(--color-ink);background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-sm);padding:0 8px;width:100%;box-sizing:border-box;min-width:0}
.t0x-tf .ok{border:2px solid var(--color-ok);background:var(--color-ok-soft)}.t0x-tf .bad{border:2px solid var(--color-bad);background:var(--color-bad-soft)}
.t0x-tf-scroll{overflow-x:auto}.t0x-tbl{border-collapse:collapse;width:100%}.t0x-tbl th,.t0x-tbl td{border:1px solid var(--color-line);padding:4px;text-align:left}
`;
  if (!document.getElementById('t0x-tf-css')) { const s = document.createElement('style'); s.id = 't0x-tf-css'; s.textContent = css; document.head.append(s); }
  T0.registerEx('ex.table_fill', { render });
})();

</script>

  const SH = { H: [1], He: [2], Li: [2, 1], Be: [2, 2], B: [2, 3], C: [2, 4], N: [2, 5], O: [2, 6], F: [2, 7], Ne: [2, 8], Na: [2, 8, 1], Mg: [2, 8, 2], Al: [2, 8, 3], Si: [2, 8, 4], P: [2, 8, 5], S: [2, 8, 6], Cl: [2, 8, 7], Ar: [2, 8, 8], K: [2, 8, 8, 1], Ca: [2, 8, 8, 2], Br: [2, 8, 18, 7], Kr: [2, 8, 18, 8], Rb: [2, 8, 18, 8, 1], I: [2, 8, 18, 18, 7], Cs: [2, 8, 18, 18, 8, 1] };
  const NS = 'http://www.w3.org/2000/svg';
  function svg(tag, a) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; }
  function atom(sym) {
    const sh = SH[sym] || [];
    const Z = sh.reduce((a, b) => a + b, 0);
    const n = sh.length, R = 18 + n * 16, size = 2 * R + 8;
    const s = svg('svg', { viewBox: `0 0 ${size} ${size}`, width: '100%', role: 'img', 'aria-label': `${sym}: ${sh.join(', ')}` });
    s.style.maxWidth = '220px';
    const c = size / 2;
    sh.forEach((k, i) => {
      const r = 18 + (i + 1) * 16;
      s.append(svg('circle', { cx: c, cy: c, r, fill: 'none', stroke: 'currentColor', 'stroke-opacity': '.45' }));
      for (let j = 0; j < k; j++) {
        const a = (j / k) * Math.PI * 2 - Math.PI / 2;
        const outer = i === n - 1;
        s.append(svg('circle', { cx: c + r * Math.cos(a), cy: c + r * Math.sin(a), r: outer ? 4.5 : 3, fill: outer ? '#F2C230' : '#7FC4F0' }));
      }
    });
    s.append(svg('circle', { cx: c, cy: c, r: 15, fill: '#C9303A' }));
    const t = svg('text', { x: c, y: c + 4, 'text-anchor': 'middle', 'font-size': '11', 'font-weight': '700', fill: '#fff' });
    t.textContent = '+' + Z; s.append(t);
    return s;
  }
  T0.registerSim('sim.atom_shells', {
    mount(el, params) {
      const E = T0.ui.el;
      const els = [].concat(params.el || params.elements || []);
      const root = E('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px', alignItems: 'center', color: 'inherit' } });
      const draw = () => {
        root.innerHTML = '';
        if (params.title) root.append(E('div', { style: { fontWeight: '700' }, text: T0.t(params.title) }));
        const row = E('div', { style: { display: 'flex', gap: '16px', justifyContent: 'center', flexWrap: 'wrap', width: '100%' } });
        els.forEach((sym) => row.append(E('figure', { style: { margin: 0, textAlign: 'center', flex: '1 1 120px', maxWidth: '220px' } }, atom(sym), E('figcaption', { style: { fontWeight: '700' }, text: sym + ' ' + (SH[sym] || []).join(' · ') }))));
        root.append(row);
        if (params.note) root.append(E('div', { style: { fontSize: '14px', opacity: '.9', textAlign: 'center' }, text: T0.t(params.note) }));
      };
      draw();
      const off = T0.on('t0:lang', draw);
      el.append(root);
      return { unmount() { off(); root.remove(); } };
    },
  });
})();

</script>
<script>/* components/sim/figure_explorer.js */
/* sim.figure_explorer – khám phá hình có điểm nóng đánh số (R1).
 * params nhận 3 dạng:
 *  1) {figure: <id trong book.figures> | <đối tượng figure>}  (schema $defs/figure: page, box, src?, caption, intro, points[{x,y,name,desc}])
 *  2) dạng thư viện: {background:'page_crop'|'image', page?, b|box, src?, cap, intro, items[{x,y,name,desc}]}
 *  3) dạng tabiiy5 mountFlower: {viewbox:[x,y,w,h], parts[{name, function, hx, hy}]} – hình vẽ bằng mã chưa tham số hóa,
 *     ảnh nền lấy từ params.background_src (vd. 'sim/flower.svg' do R2 xuất, phủ đúng viewbox); thiếu ảnh thì nền trống.
 * Mở từ ghim: T0.renderSim(el, {kind:'sim.figure_explorer', params:{figure:'p37.rasm4'}}). */
(function () {
  const T0 = window.T0;
  const CSS = `
.fx{display:flex;flex-direction:column;gap:var(--space-3,12px)}
.fx-intro{margin:0;line-height:var(--lh-body,1.5);font-size:var(--text-ui,15px)}
.fx-stage{position:relative;border:1px solid var(--color-line);border-radius:var(--radius-md,10px);overflow:hidden;background:var(--color-page-paper)}
.fx-stage .t0-crop{border-radius:0}
.fx-dot{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--pin-ring,#fff);background:var(--pin-figure);color:#fff;font:700 13px/1 var(--font-body);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-pin);cursor:pointer;padding:0}
.fx-dot[aria-pressed="true"]{background:var(--pin-active);color:#14324A;transform:translate(-50%,-50%) scale(1.15)}
.fx-dot:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}
.fx-info{min-height:3em;background:var(--color-surface-2);border-radius:var(--radius-md,10px);padding:var(--space-3,12px);font-size:var(--text-ui,15px);line-height:var(--lh-body,1.5)}
.fx-info h3{margin:0 0 4px;font-size:var(--text-body,16px)}
.fx-info p{margin:0}
.fx-list{display:flex;flex-wrap:wrap;gap:var(--space-2,8px);list-style:none;margin:0;padding:0}
.fx-list button{min-height:var(--touch-min,44px);border:1px solid var(--color-line);border-radius:var(--radius-pill,999px);background:var(--color-surface);color:var(--color-ink);font:inherit;font-size:var(--text-sm,13px);padding:0 var(--space-3,12px);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fx-list button b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--pin-figure);color:#fff;align-items:center;justify-content:center;font-size:12px}
.fx-list button[aria-pressed="true"]{border-color:var(--pin-figure);background:var(--color-accent-soft)}
.fx-row{display:flex;gap:var(--space-2,8px);flex-wrap:wrap}`;
  function css() { if (!document.getElementById('fx-css')) document.head.append(Object.assign(document.createElement('style'), { id: 'fx-css', textContent: CSS })); }
  const TOUR = { uz: 'Sayohat', ru: 'Обзор', vi: 'Tham quan' };
  const LISTEN = { uz: 'Tinglash', ru: 'Слушать', vi: 'Nghe' };

  function normalize(params) {
    let f = params.figure;
    if (typeof f === 'string') f = T0.find('figure', f);
    if (f) return { page: f.page, box: f.box, src: f.src, caption: f.caption, intro: f.intro, no: f.no, points: (f.points || []).map((p) => ({ x: p.x, y: p.y, name: p.name, desc: p.desc })) };
    if (params.parts) {
      const [vx, vy, vw, vh] = params.viewbox || [0, 0, 100, 100];
      return { blank: vw / vh, bgSrc: params.background_src || params.src || null, caption: params.cap || params.caption, intro: params.intro, points: params.parts.map((p) => ({ x: ((p.hx - vx) / vw) * 100, y: ((p.hy - vy) / vh) * 100, name: p.name, desc: p.function || p.desc })) };
    }
    return { page: params.page, box: params.b || params.box, src: params.src, caption: params.cap || params.caption, intro: params.intro, no: params.no, points: params.items || params.points || [] };
  }

  T0.registerSim('sim.figure_explorer', {
    mount(el, params, ctx) {
      css();
      const E = T0.ui.el;
      const F = normalize(params || {});
      const root = E('div', { class: 'fx' });
      el.append(root);
      let sel = -1, tourTimer = null;
      const offLang = T0.on('t0:lang', () => draw());
      function draw() {
        root.innerHTML = '';
        if (F.intro) root.append(E('p', { class: 'fx-intro', text: T0.t(F.intro) }));
        const stage = E('div', { class: 'fx-stage' });
        if (F.blank) {
          const box = E('div', { style: { aspectRatio: String(F.blank), width: '100%', position: 'relative' } });
          if (F.bgSrc) {
            const im = E('img', { src: T0.asset(F.bgSrc), alt: T0.t(F.caption), style: { position: 'absolute', inset: '0', width: '100%', height: '100%', objectFit: 'fill' } });
            im.onerror = () => im.remove();
            box.append(im);
          }
          stage.append(box);
        }
        else if (F.src && !F.box) stage.append(E('img', { src: T0.asset(F.src), alt: T0.t(F.caption), style: { display: 'block', width: '100%' } }));
        else stage.append(T0.ui.pageCrop(F.page, F.box, { src: F.src, alt: T0.t(F.caption) }));
        const info = E('div', { class: 'fx-info', 'aria-live': 'polite' });
        const list = E('ul', { class: 'fx-list' });
        const dots = F.points.map((p, i) => {
          const d = E('button', { type: 'button', class: 'fx-dot k-hit', style: { left: p.x + '%', top: p.y + '%' }, 'aria-label': (i + 1) + '. ' + T0.t(p.name), 'aria-pressed': 'false', text: String(i + 1) });
          d.onclick = () => pick(i);
          stage.append(d);
          const lb = E('button', { type: 'button', 'aria-pressed': 'false' }, E('b', { text: String(i + 1) }), T0.t(p.name));
          lb.onclick = () => pick(i);
          list.append(E('li', null, lb));
          return [d, lb];
        });
        function pick(i, speak) {
          sel = i;
          dots.forEach(([d, lb], j) => { d.setAttribute('aria-pressed', String(i === j)); lb.setAttribute('aria-pressed', String(i === j)); });
          const p = F.points[i];
          info.innerHTML = '';
          info.append(E('h3', { text: (i + 1) + '. ' + T0.t(p.name) }), E('p', { text: T0.t(p.desc) }));
          if (speak) return T0.media.speak([T0.t(p.name), T0.t(p.desc)].join('. '));
        }
        const row = E('div', { class: 'fx-row' });
        const tour = T0.ui.button('▶ ' + T0.t(TOUR), async () => {
          if (tourTimer) { tourTimer = null; T0.media.stop(); tour.textContent = '▶ ' + T0.t(TOUR); return; }
          tourTimer = 1; tour.textContent = '■ ' + T0.t(TOUR);
          for (let i = 0; i < F.points.length && tourTimer; i++) { await pick(i, true); await new Promise((r) => setTimeout(r, 400)); }
          tourTimer = null; tour.textContent = '▶ ' + T0.t(TOUR);
        });
        row.append(tour);
        if (F.intro) row.append(T0.ui.button('🔊 ' + T0.t(LISTEN), () => T0.media.speak(T0.t(F.intro))));
        root.append(stage, info, list, row);
        if (sel >= 0) pick(sel); else info.textContent = T0.t(F.caption);
      }
      draw();
      return { unmount() { tourTimer = null; offLang(); T0.media.stop(); root.remove(); }, pick: (i) => root.querySelectorAll('.fx-dot')[i].click() };
    },
  });
})();

</script>
<script>/* components/sim/scene_custom_draw.js */
/* components/sim/scene_custom_draw.js — R2. sim.scene_custom_draw (thu-vien/mo-phong/danh-muc.json):
