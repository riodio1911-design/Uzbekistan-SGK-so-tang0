window.T0_SAMPLES["adabiyot5"]={book:{"schema_version":"0.9.0","book_id":"adabiyot5","profile":{"title":{"uz":"Adabiyot","vi":"Văn học","ru":"Литература"},"subject":"literature","subject_id":"literature","grade":5,"age":"10–11","grade_band":"5-7","audience":"hoc_sinh","lang_base":"uz","langs":["uz","vi","ru"],"country":"Uzbekistan","country_code":"UZ","tutor_persona":"oqilbek","tutor":{"persona":"oqilbek"},"edition":{"part":"I","year":2024,"city":"Toshkent","print_editions":["uz"],"note":"Ban dich chua qua nguoi ban ngu duyet; audio la giong may (TTS)"},"volumes":[{"id":"tb","kind":"textbook","page_count":98,"first_page":1}]},"units":[{"id":"u2","no":2,"kind":"poem","title":{"uz":"Abdulla Oripov","ru":"Абдулла Арипов","vi":"Abdulla Oripov"},"subtitle":{"uz":"“Qushcha”, “Men nechun sevaman O‘zbekistonni?”, “Miltiraydi mitti yulduz”, “Burgut”, “Tilla baliqcha” she’rlari","ru":"Стихотворения «Птичка», «За что я люблю Узбекистан?», «Мерцает крошечная звезда», «Орёл», «Золотая рыбка»","vi":"Các bài thơ “Chú chim nhỏ”, “Vì sao tôi yêu Uzbekistan?”, “Ngôi sao bé xíu lấp lánh”, “Đại bàng”, “Chú cá vàng nhỏ”"},"page_range":[8,14],"hero":{"page":8,"box":[0,0,100,33]},"lesson_refs":["u2.1"]}],"lessons":[{"id":"u2.1","unit":"u2","page_range":[8,14],"title":{"uz":"Abdulla Oripov","ru":"Абдулла Арипов","vi":"Abdulla Oripov"},"blocks":[{"id":"u2.1.0","rubric":"bio","page":8,"title":{"uz":"Abdulla Oripov","ru":"Абдулла Арипов","vi":"Abdulla Oripov"},"type":"text","paras":[{"uz":"Xalqimizning sevimli shoiri Abdulla Oripov 1941-yilning 21-martida Qashqadaryo viloyatida dunyoga kelgan. O‘zi haqida shoir bunday yozadi:","ru":"Любимый поэт нашего народа Абдулла Арипов родился 21 марта 1941 года в Кашкадарьинской области. О себе поэт пишет так:","vi":"Nhà thơ được nhân dân ta yêu mến Abdulla Oripov chào đời ngày 21 tháng 3 năm 1941 tại tỉnh Qashqadaryo. Nhà thơ viết về mình như sau:","no_read":true},{"uz":"“Men tug‘ilib o‘sgan, bolaligim o‘tgan joylar Qarshi (qadimgi Nasaf) shahridan besh-o‘n chaqirim shimolroq tomondagi Qo‘ng‘irtov etaklaridir.","ru":"«Места, где я родился и вырос, где прошло моё детство, — это подножия гор Кунгиртау, в пяти-десяти верстах к северу от города Карши (древнего Насафа).","vi":"“Nơi tôi sinh ra và lớn lên, nơi tuổi thơ tôi trôi qua là vùng chân núi Qo‘ng‘irtov, cách thành phố Qarshi (Nasaf thời xưa) chừng năm đến mười dặm về phía bắc.","no_read":true},{"uz":"…Bahor kelganda havoni o‘t-o‘lanning yoqimli xushbo‘y hidi qoplar, sharros yomg‘ir quyganda biz tog‘ cho‘qqisi unguridagi kichik-kichik g‘orlarga bekinib olardik.","ru":"…Когда приходила весна, воздух наполнялся приятным душистым запахом трав, а когда лил проливной дождь, мы прятались в маленьких пещерках в углублении на вершине горы.","vi":"…Khi mùa xuân đến, mùi hương dễ chịu của cỏ cây bao trùm không khí; khi mưa rào trút xuống, chúng tôi nấp vào những hang động nho nhỏ trong hốc lõm trên đỉnh núi.","no_read":true},{"uz":"O‘sha yuksaklikdan shimol tarafdagi yam-yashil, bepoyon kengliklarni tomosha qilar edim, ko‘ksimni to‘ldirib nafas olardim. Ayniqsa, bu joylarda janub kechalari, yulduzli osmon nihoyatda go‘zal bo‘lar edi. Tim qora osmonda qo‘l cho‘zsang yetgudek ulkan-ulkan novvotrang yulduzlar charaqlab turadi. Hayotimda bunday go‘zal manzaralarni keyin uchrata olmadim...","ru":"С той высоты я любовался зелёными-презелёными бескрайними просторами на севере и дышал полной грудью. Особенно прекрасны были в этих местах южные ночи и звёздное небо. В чёрном-пречёрном небе сияют огромные звёзды цвета золотистого леденца — кажется, протяни руку и достанешь. Таких прекрасных картин я больше в жизни не встречал...","vi":"Từ độ cao ấy, tôi ngắm nhìn những khoảng không gian xanh mướt, bao la ở phía bắc và hít thở căng đầy lồng ngực. Đặc biệt, ở những nơi này, đêm phương nam và bầu trời đầy sao đẹp vô cùng. Trên nền trời đen thẫm, những ngôi sao to lớn màu vàng hổ phách như đường phèn sáng rực, tưởng chừng với tay là chạm tới. Về sau trong đời, tôi không còn gặp được những cảnh đẹp như thế nữa...","no_read":true},{"uz":"She’rlarim avval tuman, viloyat gazetalarida chop etilgan bo‘lsa-da, birinchi marta respublika gazetasida “Qushcha” degan she’rim bosilib chiqqan… Bu orada qanchadan qancha she’rlarim, to‘plamlarim chop etildi. Biroq ilk she’rim bosilib chiqqan o‘sha daqiqalar, uning quvonchi sira-sira esimdan chiqmaydi”.","ru":"Хотя мои стихи сначала печатались в районных и областных газетах, впервые в республиканской газете было напечатано моё стихотворение «Птичка»… С тех пор вышло множество моих стихотворений и сборников. Но те минуты, когда было напечатано моё первое стихотворение, и ту радость я никогда-никогда не забуду».","vi":"Tuy trước đó thơ tôi đã được in trên các báo huyện, báo tỉnh, nhưng bài thơ đầu tiên của tôi được đăng trên báo của nước cộng hoà là bài “Chú chim nhỏ”… Từ đó đến nay, biết bao bài thơ, tập thơ của tôi đã được xuất bản. Thế nhưng những phút giây bài thơ đầu tiên được in ra và niềm vui ấy, tôi không bao giờ, không bao giờ quên được”.","no_read":true},{"uz":"Mana o‘sha she’r bilan tanishing:","ru":"Вот, познакомьтесь с этим стихотворением:","vi":"Đây, các em hãy làm quen với bài thơ ấy:","no_read":true}],"crop":{"page":8,"box":[0,0,100,33]}},{"id":"u2.1.1","rubric":"poem","page":8,"title":{"uz":"Qushcha","ru":"Птичка","vi":"Chú chim nhỏ","audio_ref":"u2_p1#6"},"type":"poem","stanzas":[[{"uz":"Goh butoqqa, goh gulga qo‘nar,","ru":"То на ветку, то на цветок садится,","vi":"Lúc đậu trên cành, lúc đậu trên hoa,","audio_ref":"u2_p1#7"},{"uz":"Tinim bilmas sayroqi qushcha.","ru":"Не знающая покоя певчая птичка.","vi":"Chú chim nhỏ hay hót chẳng biết nghỉ ngơi.","audio_ref":"u2_p1#8"},{"uz":"Nechun bahor seni rom etgan,","ru":"Отчего весна тебя так заворожила,","vi":"Vì sao mùa xuân lại mê hoặc em đến thế,","audio_ref":"u2_p1#9"},{"uz":"Qayda eding bahor kelguncha?","ru":"Где ты была, пока не пришла весна?","vi":"Em đã ở đâu trước khi mùa xuân về?","audio_ref":"u2_p1#10"}],[{"uz":"Kel, yashaylik hamisha birga,","ru":"Давай будем всегда жить вместе,","vi":"Lại đây, ta hãy luôn sống cùng nhau,","audio_ref":"u2_p1#11"},{"uz":"Bizda bahor, gullar – barchasi.","ru":"У нас весна, цветы — всё есть.","vi":"Ở chỗ chúng tôi có mùa xuân, có hoa – có tất cả.","audio_ref":"u2_p1#12"},{"uz":"Bilsang, men ham chaman o‘lkamning","ru":"Знаешь, я ведь тоже своего цветущего края","vi":"Em biết không, tôi cũng là của xứ sở ngàn hoa của tôi","audio_ref":"u2_p1#13"},{"uz":"Sho‘x va quvnoq, shod o‘g‘ilchasi.","ru":"Резвый и весёлый, радостный сынок.","vi":"Một cậu con trai nhỏ nghịch ngợm, vui tươi, hớn hở.","audio_ref":"u2_p1#14"}]]},{"id":"u2.1.2","rubric":"p","page":8,"type":"text","paras":[{"uz":"Abdulla Oripov O‘zbekiston Qahramoni, O‘zbekiston xalq shoiri kabi yuksak unvonlarga sazovor bo‘lgan. U O‘zbekiston Respublikasi Davlat madhiyasi matnining muallifi.","ru":"Абдулла Арипов был удостоен таких высоких званий, как Герой Узбекистана и Народный поэт Узбекистана. Он — автор текста Государственного гимна Республики Узбекистан.","vi":"Abdulla Oripov đã được trao những danh hiệu cao quý như Anh hùng Uzbekistan, Nhà thơ nhân dân Uzbekistan. Ông là tác giả lời Quốc ca của nước Cộng hoà Uzbekistan.","no_read":true},{"uz":"Shoir 2016-yil 5-noyabr kuni vafot etgan.","ru":"Поэт скончался 5 ноября 2016 года.","vi":"Nhà thơ qua đời ngày 5 tháng 11 năm 2016.","no_read":true}]},{"id":"u2.1.3","rubric":"quiz","page":8,"type":"exercise","exercise_refs":["u2.1.3"],"teacher_editable":true},{"id":"u2.1.7","rubric":"talk","page":10,"type":"exercise","exercise_refs":["u2.1.7"]}]}],"pages":[{"n":8,"label":"8","images":{"uz":"pages/p008.jpg"},"background":"bg/p008.jpg","text_lines":[[47.43,776.4,7.2,12.0,6,"8",-1,null],[73.35,337.56,424.1,12.0,0,"Xalqimizning sevimli shoiri Abdulla Oripov 1941-yilning 21-martida Qashqadaryo",43,"hot43"],[56.35,352.56,313.11,12.0,0,"viloyatida dunyoga kelgan. O‘zi haqida shoir bunday yozadi:",43,"hot43"],[73.35,367.56,438.43,12.0,1,"“Men tug‘ilib o‘sgan, bolaligim o‘tgan joyla k":{"role":"open_feedback","context":"preceding_text"},"items":[{"id":"u2.1.7.0","prompt":{"uz":"Sizga Vataningizning suratini chizib bering deyishsa, dastlab xayolingizga nimalar keladi? Nimalarni qog‘ozga tushirar edingiz? Tasvirda qanday ranglardan foydalanardingiz? Nima uchun?","ru":"Если бы вас попросили нарисовать картину вашей Родины, что прежде всего пришло бы вам на ум? Что бы вы изобразили на бумаге? Какие цвета вы использовали бы в рисунке? Почему?","vi":"Nếu người ta bảo em hãy vẽ bức tranh về Tổ quốc mình, điều gì sẽ hiện ra trong đầu em trước tiên? Em sẽ vẽ những gì lên giấy? Em sẽ dùng những màu nào trong bức tranh? Vì sao?","no_read":true},"ai_feedback":true},{"id":"u2.1.7.1","prompt":{"uz":"Shoirning Vatan, yer, osmon kabi tushunchalarni muqaddas va yagona deb hisoblashi sababi nimada?","ru":"В чём причина того, что поэт считает такие понятия, как Родина, земля, небо, священными и единственными?","vi":"Vì sao nhà thơ coi những khái niệm như Tổ quốc, đất, trời là thiêng liêng và duy nhất?","no_read":true},"ai_feedback":true},{"id":"u2.1.7.2","prompt":{"uz":"Sizningcha, shoir Vatanni faqat paxtasi, quyoshi, bog‘-u rog‘lari uchun yaxshi ko‘radimi yoki buning boshqa sabablari ham bormi? Misol sifatida qanday sabablarni ayta olasiz?","ru":"Как по-вашему, поэт любит Родину только за её хлопок, солнце, сады и цветники, или на это есть и другие причины? Какие причины вы можете привести в пример?","vi":"Theo em, nhà thơ yêu Tổ quốc chỉ vì bông, vì mặt trời, vì vườn tược hay còn có những lý do khác? Em có thể nêu những lý do nào làm ví dụ?","no_read":true},"ai_feedback":true},{"id":"u2.1.7.3","prompt":{"uz":"Umr bo‘yi ona yurt sog‘inchi bilan yashagan ajdodlarimizdan kimlarni bilasiz?","ru":"Кого из наших предков, всю жизнь проживших в тоске по родному краю, вы знаете?","vi":"Em biết những ai trong số tổ tiên chúng ta đã suốt đời sống trong nỗi nhớ quê hương?","no_read":true},"ai_feedback":true},{"id":"u2.1.7.4","prompt":{"uz":"Shoirdan O‘zbekistonni nima uchun sevishini so‘rashganda u qanday javob berdi? Nega u javob berishdan oldin: “Men ta’zim qilaman ona xalqimga”, demoqda?","ru":"Как ответил поэт, когда его спросили, за что он любит Узбекистан? Почему, прежде чем ответить, он говорит: «Я поклонюсь моему родному народу»?","vi":"Khi người ta hỏi nhà thơ vì sao ông yêu Uzbekistan, ông đã trả lời thế nào? Vì sao trước khi trả lời, ông nói: “Tôi xin cúi đầu trước nhân dân mẹ hiền của tôi”?","no_read":true},"ai_feedback":true},{"id":"u2.1.7.5","prompt":{"uz":"So‘nggi banddagi “Yurtim, seni faqat boyliklaring-chun sevgan farzand bo‘lsa, kechirma aslo!” xitobining mazmuni haqida mulohaza yuriting. O‘ylab ko‘ring, yurt kimlarni va nima uchun kechirmaydi?","ru":"Поразмышляйте о смысле обращения в последней строфе: «Край мой, если найдётся дитя, что лишь за твои богатства любит тебя, — не прощай никогда!» Подумайте, кого и почему не прощает родной край?","vi":"Hãy suy ngẫm về ý nghĩa của lời kêu gọi ở khổ cuối: “Quê hương ơi, nếu có đứa con nào chỉ vì của cải của Người mà yêu Người, thì xin đừng bao giờ tha thứ!”. Em hãy nghĩ xem, quê hương không tha thứ cho những ai và vì sao?","no_read":true},"ai_feedback":true}]}],"media":{"fallback_tts":true,"files":[{"path":"audio/uz/u2_p1_0.mp3","kind":"audio","lang":"uz","voice":"tts","used":true},{"path":"audio/vi/u2_p1_0.mp3","kind":"audio","lang":"vi","voice":"tts","used":true},{"path":"audio/ru/u2_p1_0.mp3","kind":"audio","lang":"ru","voice":"tts","used":true}],"clips":{"u2_p1#6":{"uz":{"file":"audio/uz/u2_p1_0.mp3","start":0.0,"dur":1.87,"source_hash":"sha256:0df22bdd7e530cce0bc99b4bd11d3cda711b1a6ebbce3185da035371025c7bc0"},"vi":{"file":"audio/vi/u2_p1_0.mp3","start":0.0,"dur":1.97,"source_hash":"sha256:25f392f8d29e7f0f44b84ed1f34d938c0cfe17561f01101237be75c098b8ea0d"},"ru":{"file":"audio/ru/u2_p1_0.mp3","start":0.0,"dur":1.94,"source_hash":"sha256:fed1ef7a294655529539e95837a5150c5f558d5de054e9e549908740866fbc6c"}},"u2_p1#7":{"uz":{"file":"audio/uz/u2_p1_0.mp3","start":1.87,"dur"       b.setAttribute('aria-pressed', String(T0.currentMode() === m));
      b.onclick = () => { T0.setMode(m); };
      nav.append(b);
    });
  }
  function openBook(id, mode) {
    const s = S[id]; if (!s) return;
    T0.load(s.book, s.features);
    try { localStorage.setItem('t0:_:book', id); } catch (e) {}
    bookSel.value = id;
    const av = T0.availableModes();
    const want = mode || T0.store.get('mode') || VIEW2MODE[(s.features.layers || {}).default_view] || 'pin';
    const m = av.includes(want) ? want : av[0];
    renderTop();
    if (m) T0.setMode(m, { target: q.get('page') ? { page: +q.get('page') } : null });
  }
  T0.on('t0:mode', () => document.querySelectorAll('#t0-modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === T0.currentMode()))));
  T0.on('t0:lang', () => { renderTop(); $('t0-lang').value = T0.lang; });
  bookSel.onchange = () => openBook(bookSel.value);
  $('t0-lang').onchange = (e) => T0.setLang(e.target.value);
  $('t0-theme').onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('t0:_:theme', r.dataset.theme); } catch (e) {}
  };
  const first = q.get('book') || (() => { try { return localStorage.getItem('t0:_:book'); } catch (e) { return null; } })();
  openBook(S[first] ? first : Object.keys(S)[0], q.get('mode'));
})();
</script>
